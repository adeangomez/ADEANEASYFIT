<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rutina" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Rutina — Circuito de entreno</title>
<link rel="apple-touch-icon" href="https://adeangomez.github.io/ADEANEASYFIT/assets/icon.png">
<link rel="icon" type="image/png" href="https://adeangomez.github.io/ADEANEASYFIT/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #131418;
    --card: #16171c;
    --card-2: #1d1f25;
    --line: #2b2d34;
    --line-soft: #202227;
    --text: #f3f4f6;
    --text-dim: #a4a8b1;
    --text-faint: #676b75;
    --iron: #ff5a2e;
    --iron-hover: #ff6d45;
    --iron-dim: #3d1f14;
    --steel: #8b93a1;
    --up: #34c579;
    --down: #f2504f;
    --flat: #8b93a1;
    --lock: #3a3c43;
    --gold: #d9a441;
    --radius: 14px;
    --radius-lg: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
  }
  body{
    padding-top: var(--safe-top);
    padding-bottom: calc(78px + var(--safe-bottom));
    min-height: 100vh;
  }
  .display{ font-family:'Space Grotesk', sans-serif; letter-spacing: -0.015em; font-weight:700; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* HEADER */
  header.top{
    padding: 20px 20px 16px;
    background: linear-gradient(180deg, var(--bg-elev), var(--bg));
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.45);
  }
  .brand{ display:flex; align-items:center; justify-content:flex-start; gap:0; }
  .brand h1{ font-size: 24px; margin:0; color:var(--text); line-height:1; text-transform:uppercase; }
  .brand h1 span{ color:var(--iron); }
  .tag{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-top:10px; }

  /* DAY TRACK */
  .track{ display:flex; align-items:center; gap:5px; margin-top:18px; }
  .track-node{ flex:1; height:5px; border-radius:3px; background: var(--lock); position:relative; transition: background .25s, transform .1s; cursor:pointer; }
  .track-node:hover{ background: var(--text-faint); }
  .track-node:active{ transform: scaleY(1.6); }
  .track-node.done{ background: var(--steel); }
  .track-node.active{ background: var(--iron); box-shadow: 0 0 8px rgba(255,90,46,0.45); }
  .track-labels{ display:flex; margin-top:8px; }
  .track-labels span{ flex:1; text-align:center; font-size:9px; letter-spacing:0.05em; color:var(--text-faint); text-transform:uppercase; font-weight:600; cursor:pointer; }
  .track-labels span:hover{ color:var(--text-dim); }
  .track-labels span.active{ color:var(--iron); font-weight:700; }

  /* NAV TABS */
  nav.tabs{
    position: fixed; bottom:0; left:0; right:0; display:flex; background: rgba(19,20,24,0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top:1px solid var(--line-soft); padding-bottom: var(--safe-bottom); z-index: 30;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint); padding: 11px 4px 9px;
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:0.03em;
    text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    position:relative; transition: color .18s ease;
  }
  nav.tabs button .ic{ width:21px; height:21px; display:flex; align-items:center; justify-content:center; transition: transform .18s ease; }
  nav.tabs button .ic svg{ width:100%; height:100%; }
  nav.tabs button.active{ color: var(--iron); }
  nav.tabs button.active .ic{ transform: translateY(-1px) scale(1.08); }
  nav.tabs button:active .ic{ transform: scale(0.9); }
  nav.tabs button.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:28px; height:2px; border-radius:0 0 3px 3px; background: var(--iron);
    transition: opacity .18s ease;
  }

  main{ padding: 20px 16px 12px; max-width: 640px; margin: 0 auto; transition: opacity .12s ease; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin: 4px 2px 14px; }
  .section-title h2{ font-family:'Space Grotesk', sans-serif; font-size:21px; margin:0; color:var(--text); font-weight:700; letter-spacing:-0.01em; }
  .pill{ font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding: 5px 10px; border-radius: 100px; background: var(--iron-dim); color: var(--iron-hover); border:1px solid rgba(255,90,46,0.25); }

  .exercise-card{ background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 14px; overflow:hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 16px -10px rgba(0,0,0,0.5); }
  .exercise-head{ padding: 12px 16px 12px; border-bottom: 1px solid var(--line-soft); }
  .exercise-head-top{ display:flex; align-items:center; gap:12px; }
  .exercise-thumb{ width:52px; height:52px; object-fit:contain; background:#fff; border-radius:10px; border:1px solid var(--line-soft); flex-shrink:0; }
  .exercise-head-text{ flex:1; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; min-width:0; }
  .exercise-head h3{ font-size:15.5px; margin:0; font-weight:600; color:var(--text); line-height:1.3; letter-spacing:-0.005em; }
  .exercise-head .setcount{ font-size:10.5px; color:var(--text-faint); font-weight:600; white-space:nowrap; margin-top:2px; letter-spacing:0.02em; }
  .sets{ padding: 6px 12px 12px; }
  .set-row{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; align-items:center; padding: 6px 4px; }
  .set-row .lbl{ font-size:12px; color:var(--text-faint); font-weight:700; text-align:center; }
  .set-row .field{ position:relative; }
  .set-row input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 10px 10px 8px; font-family:'JetBrains Mono'; font-size:15px; font-weight:600; text-align:center; }
  .set-row input:focus{ outline:none; border-color: var(--iron); }
  .set-row input::placeholder{ color: var(--text-faint); font-weight:500; }
  .field .unit{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:9.5px; color:var(--text-faint); pointer-events:none; font-weight:700; }
  .col-heads{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; padding: 2px 4px 4px; margin-top:2px; }
  .col-heads span{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); text-align:center; font-weight:800; }
  .col-heads span:first-child{ visibility:hidden; }

  /* Selector de ejercicios (biblioteca cerrada) */
  .ex-picker-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ex-picker-btn{
    flex:1; display:flex; align-items:center; gap:10px; min-width:0;
    background: var(--card-2); border:1px solid var(--line); border-radius:10px;
    padding:7px 10px 7px 7px; cursor:pointer; text-align:left;
  }
  .ex-thumb{ width:46px; height:46px; border-radius:8px; object-fit:contain; background:#fff; flex-shrink:0; }
  .ex-thumb-empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:16px; border:1px dashed var(--line); background:transparent; }
  .ex-picker-label{ font-size:13.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ex-sets-field{ width:76px; flex-shrink:0; }
  .ex-sets-field input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 8px; font-family:'JetBrains Mono'; font-size:14px; font-weight:600; text-align:center; }

  .ex-search-input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:14.5px; margin-bottom:12px; font-family:'Inter'; }
  .ex-search-input:focus{ outline:none; border-color: var(--iron); }
  .ex-picker-grid{ overflow-y:auto; flex:1; margin-bottom:10px; }
  .ex-picker-group-label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); margin:14px 2px 8px; }
  .ex-picker-group-label:first-child{ margin-top:0; }
  .ex-picker-list{ background: var(--card-2); border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  .ex-picker-row-item{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--line-soft);
    padding:10px 12px; cursor:pointer;
  }
  .ex-picker-row-item:last-child{ border-bottom:none; }
  .ex-picker-row-item:active{ background: var(--iron-dim); }
  .ex-picker-row-item img{ width:62px; height:62px; object-fit:contain; background:#fff; border-radius:10px; flex-shrink:0; border:1px solid var(--line-soft); }
  .ex-picker-row-item .ex-row-name{ font-size:13.5px; font-weight:600; color:var(--text); flex:1; line-height:1.3; }
  .ex-row-secondary{ font-size:10.5px; font-weight:600; color:var(--text-faint); }
  .ex-picker-row-item .ex-row-chevron{ color:var(--text-faint); flex-shrink:0; display:flex; }
  .ex-picker-row-item .ex-row-chevron svg{ width:16px; height:16px; }
  .ex-suggest-box{ border-top:1px solid var(--line-soft); padding-top:10px; margin-top:2px; }

  .last-time{ font-size:11px; color:var(--text-faint); text-align:center; margin-top:8px; }
  .last-time b{ color:var(--steel); font-weight:700; }

  .save-bar{ margin-top: 8px; padding: 4px 2px 20px; }

  /* TEMPORIZADOR DE DESCANSO */
  #restTimerWidget{
    position: fixed; left:12px; right:12px; bottom: calc(78px + var(--safe-bottom) + 10px);
    z-index: 25; display:flex; justify-content:center;
  }
  #restTimerWidget:empty{ display:none; }
  .rest-timer{
    width:100%; max-width:460px; background: rgba(24,25,30,0.96); border:1px solid var(--line-soft);
    border-radius: 14px; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow:hidden; position:relative;
  }
  .rest-timer-picker{ display:flex; align-items:center; gap:6px; padding:9px 10px; }
  .rest-timer-ic{ width:16px; height:16px; color:var(--iron); flex-shrink:0; display:flex; }
  .rest-timer-ic svg{ width:100%; height:100%; }
  .rest-timer-sub{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-right:2px; }
  .rest-timer-options{ display:flex; gap:5px; flex:1; }
  .rest-timer-options button{
    flex:1; min-width:0; background:var(--card-2); border:1px solid var(--line); color:var(--text-dim);
    padding:7px 2px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .rest-timer-options button:hover{ background:var(--line-soft); border-color:var(--text-faint); color:var(--text); }
  .rest-timer-options button:active{ transform: scale(0.94); }
  .rest-timer-running .rest-timer-row{ display:flex; align-items:center; gap:8px; padding:10px 14px; position:relative; z-index:1; }
  .rest-timer-fill{ position:absolute; inset:0; background: linear-gradient(90deg, rgba(255,90,46,0.28), rgba(255,90,46,0.12)); transition: width .25s linear; }
  .rest-timer-time{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; color:var(--text); letter-spacing:0.02em; }
  .rest-timer-cancel{
    margin-left:auto; background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:600;
    cursor:pointer; padding:6px 8px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .rest-timer-cancel:hover{ color:var(--down); }
  .btn-primary{ width:100%; background: var(--iron); color:#1a0b06; border:none; padding: 15px; border-radius: 12px; font-size:14.5px; font-weight:700; letter-spacing:0.01em; text-transform:uppercase; cursor:pointer; transition: background .15s; }
  .btn-primary:hover{ background: var(--iron-hover); }
  .btn-primary:active{ transform: scale(0.985); }
  .btn-primary:disabled{ opacity:0.5; }
  .btn-secondary{ width:100%; background:var(--card-2); border:1px solid var(--line); color:var(--text-dim); padding:13px; border-radius:12px; font-size:13px; font-weight:600; margin-top:10px; cursor:pointer; transition: background .15s, border-color .15s, transform .1s; }
  .btn-secondary:hover:not(:disabled){ background: var(--line-soft); border-color: var(--text-faint); color: var(--text); }
  .btn-secondary:active:not(:disabled){ transform: scale(0.985); }
  .btn-secondary:disabled{ opacity:0.55; cursor:default; }

  /* Accesibilidad: foco visible al navegar con teclado, sin afectar al ratón/táctil */
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline: 2px solid var(--iron); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  .btn-text{ background:none; border:none; color: var(--iron); font-weight:600; font-size:13px; cursor:pointer; padding:8px; }
  .btn-ai{
    width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
    background: var(--card-2); border:1px solid rgba(255,90,46,0.38); color: var(--text);
    padding:14px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; transition: border-color .15s, background .15s;
  }
  .btn-ai svg{ width:16px; height:16px; color: var(--iron); flex-shrink:0; }
  .btn-ai:hover{ border-color: rgba(255,90,46,0.65); background: var(--iron-dim); }
  .btn-ai:active{ transform: scale(0.985); }
  .btn-ai:disabled{ opacity:0.6; }
  .hint{ font-size:12px; color:var(--text-faint); text-align:center; margin-top:10px; line-height:1.5; padding: 0 10px; }

  .loading, .empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 80px 20px; color:var(--text-faint); text-align:center; }
  .empty-icon{ width:52px; height:52px; border-radius:50%; background:var(--card-2); border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center; margin-bottom:16px; color:var(--text-faint); }
  .empty-icon svg{ width:24px; height:24px; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color: var(--iron); animation: spin 0.8s linear infinite; margin-bottom:14px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .stat-card{ background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; margin-bottom:12px; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 4px 12px -10px rgba(0,0,0,0.5); }
  .stat-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stat-day-tags{ display:flex; flex-wrap:wrap; gap:5px; margin:-4px 0 10px; }
  .stat-day-tag{ font-size:10px; font-weight:700; color:var(--steel); background:var(--card-2); border:1px solid var(--line-soft); border-radius:100px; padding:3px 9px; }
  .stat-head h3{ font-size:15.5px; margin:0; font-weight:700; }
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .metric{ background: var(--card-2); border-radius:10px; padding:10px 12px; }
  .metric .m-label{ font-size:10px; color:var(--text-faint); text-transform:uppercase; font-weight:800; letter-spacing:0.04em; }
  .metric .m-value{ font-size:19px; font-weight:800; margin-top:3px; font-family:'JetBrains Mono'; }
  .delta{ display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:800; margin-top:4px; }
  .delta.up{ color:var(--up); }
  .delta.down{ color:var(--down); }
  .delta.flat{ color:var(--flat); }
  .no-data{ font-size:12px; color:var(--text-faint); font-style:italic; }

  /* Gráficas de evolución */
  .chart-block{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .mini-chart{ width:100%; height:64px; display:block; }
  .chart-caption{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--text-faint); }
  .chart-caption .up{ color:var(--up); font-weight:700; }
  .chart-caption .down{ color:var(--down); font-weight:700; }
  .chart-empty{ font-size:11.5px; color:var(--text-faint); font-style:italic; padding:8px 0; }

  /* IA */
  .ai-card{ margin-bottom:16px; }
  .ai-result{ margin-top:12px; background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); padding:14px 16px; font-size:13.5px; line-height:1.6; color:var(--text-dim); }
  .ai-result.ai-error{ color: var(--down); border-color: rgba(255,90,90,0.3); background: rgba(255,90,90,0.08); }

  .filter-row{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
  .filter-row button{ flex-shrink:0; background:var(--card-2); border:1px solid var(--line); color:var(--text-dim); padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; cursor:pointer; }
  .filter-row button.active{ background: var(--iron); color:#1a0b06; border-color:var(--iron); }

  .hist-item{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
  .hist-top{ display:flex; justify-content:space-between; align-items:center; padding:14px 14px 14px 16px; gap:10px; cursor:pointer; transition: background .15s; }
  .hist-top:hover{ background: rgba(255,255,255,0.025); }
  .hist-top:active{ background: rgba(255,255,255,0.04); }
  .hist-date-line{ font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.02em; margin-bottom:3px; }
  .hist-day{ font-weight:700; font-size:14.5px; color:var(--text); }
  .hist-plan{ color:var(--text-faint); font-weight:600; font-size:11.5px; }
  .hist-del-btn{ background:none; border:none; padding:4px; color:var(--text-faint); cursor:pointer; display:flex; }
  .hist-edit-btn{ background:none; border:none; padding:4px; color:var(--text-faint); cursor:pointer; display:flex; }
  .hist-edit-btn:hover{ color:var(--iron); }
  .hist-edit-btn svg{ width:16px; height:16px; }
  .hist-del-btn:hover{ color:var(--down); }
  .hist-del-btn svg{ width:16px; height:16px; }
  .hist-chevron{ display:flex; color:var(--text-faint); transition:transform .2s; }
  .hist-chevron svg{ width:16px; height:16px; }
  .hist-chevron.open{ transform:rotate(90deg); color:var(--iron); }
  .hist-detail{ border-top:1px solid var(--line-soft); padding:12px 16px 14px; background:var(--card-2); }
  .hist-detail-ex{ margin-bottom:10px; }
  .hist-detail-ex:last-child{ margin-bottom:0; }
  .hist-detail-ex-name{ font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:6px; }
  .hist-detail-sets{ display:flex; flex-wrap:wrap; gap:6px; }
  .hist-set-chip{ font-family:'JetBrains Mono'; font-size:11px; font-weight:600; color:var(--steel); background:var(--card); border:1px solid var(--line-soft); border-radius:7px; padding:4px 8px; }

  /* Formulario de creación de rutinas */
  .field-group{ margin-bottom:14px; }
  .field-group label{ display:block; font-size:11px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .field-group input, .field-group select{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:13px 14px; font-size:15px; font-family:'Inter'; }
  .field-group select:focus{ outline:none; border-color: var(--iron); }
  .gap-badge{ margin-top:8px; font-size:11px; font-weight:700; padding:7px 10px; border-radius:8px; text-align:center; }
  .gap-badge.up{ background: rgba(52,197,121,0.12); color: var(--up); }
  .gap-badge.down{ background: rgba(255,90,46,0.12); color: var(--iron); }

  .reminder-card{
    display:flex; align-items:center; gap:12px; background: linear-gradient(135deg, var(--iron-dim), var(--card));

// Multiplicadores orientativos: 1RM esperado ≈ peso corporal (kg) × multiplicador,
// según el tiempo entrenando. Son una referencia aproximada general (peso + tiempo
// entrenando únicamente), no una medida clínica ni ajustada a caso individual.
// Solo cubre los grandes básicos donde existen estándares de fuerza conocidos.
const STRENGTH_STANDARDS = {
  "Press banca":             { "0-3":0.50, "3-6":0.70, "6-12":0.90, "1-2a":1.15, "+2a":1.40 },
  "Peso muerto":             { "0-3":0.75, "3-6":1.00, "6-12":1.35, "1-2a":1.75, "+2a":2.10 },
  "Press militar con barra": { "0-3":0.35, "3-6":0.45, "6-12":0.55, "1-2a":0.70, "+2a":0.85 },
  "Remo con barra":          { "0-3":0.45, "3-6":0.60, "6-12":0.75, "1-2a":0.95, "+2a":1.15 },
};
function computeExpectedMax(exerciseName){
  if(!userProfile || !userProfile.weightKg || !userProfile.timeTraining) return null;
  const table = STRENGTH_STANDARDS[exerciseName];
  if(!table) return null;
  const mult = table[userProfile.timeTraining];
  if(!mult) return null;
  return Math.round(userProfile.weightKg * mult * 2) / 2; // redondeo a 0.5kg
}

// -------------------- CANDADO DE 7 DÍAS PARA ACTUALIZAR EL PESO --------------------
const WEIGHT_COOLDOWN_MS = 7 * 24 * 60 * 60 * 1000;

function canUpdateWeight(){
  if(!userProfile || !userProfile.weightUpdatedAt) return true;
  return (Date.now() - new Date(userProfile.weightUpdatedAt).getTime()) >= WEIGHT_COOLDOWN_MS;
}
function daysUntilWeightUpdate(){
  if(!userProfile || !userProfile.weightUpdatedAt) return 0;
  const elapsed = Date.now() - new Date(userProfile.weightUpdatedAt).getTime();
  const remainingMs = WEIGHT_COOLDOWN_MS - elapsed;
  if(remainingMs <= 0) return 0;
  return Math.ceil(remainingMs / (24*60*60*1000));
}

// -------------------- LLAMADAS AL SERVIDOR (Cloudflare Worker) --------------------
async function apiFetch(path, options = {}){
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(authToken ? { "Authorization": "Bearer " + authToken } : {}),
      ...(options.headers || {})
    }
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const e = new Error(data.error || ("Error del servidor (" + res.status + ")"));
    e.status = res.status;
    e.data = data;
    throw e;
  }
  return data;
}

async function apiGetData(){
  const data = await apiFetch("/data", { method: "GET" });
  if(data && typeof data._rev === "number") localDataRev = data._rev;
  return data;
}
async function apiSaveData(){
  try{
    const result = await apiFetch("/data", {
      method: "PUT",
      body: JSON.stringify({ plans, activePlanId, state, profile: userProfile, _rev: localDataRev })
    });
    if(typeof result._rev === "number") localDataRev = result._rev;
    return result;
  }catch(e){
    if(e.status === 409 && e.data){
      // El servidor ha rechazado el guardado porque hay datos más nuevos
      // (guardados desde otra pestaña o dispositivo) de los que esta
      // pestaña sabía. Nos ponemos al día con esos datos y avisamos, en
      // vez de arriesgarnos a perder progreso guardado en otro sitio.
      const fresh = e.data;
      plans = Array.isArray(fresh.plans) ? fresh.plans : plans;
      activePlanId = (fresh.activePlanId && plans.some(p=>p.id===fresh.activePlanId)) ? fresh.activePlanId : activePlanId;
      state = (fresh.state && typeof fresh.state === "object") ? fresh.state : state;
      userProfile = fresh.profile || userProfile;
      if(typeof fresh._rev === "number") localDataRev = fresh._rev;
      try{ if(currentUser && document.getElementById("main")) render(); }catch(err){}
      const conflictErr = new Error("Se han detectado cambios más recientes guardados desde otra pestaña o dispositivo. Se han recargado los datos actuales para no perder información — revisa la pantalla y repite la acción si todavía hace falta.");
      conflictErr.isStaleConflict = true;
      throw conflictErr;
    }
    throw e;
  }
}

// Algunas cuentas creadas antes de que la librería cerrada quedara fijada
// pueden tener nombres de ejercicio antiguos guardados en sus rutinas y su
// historial (p. ej. variantes de "Pec deck / Aperturas de pecho" en vez de
// "Aperturas de pecho en máquina"). Esto rompe el enlace con la foto y las
// estadísticas del ejercicio. Usamos coincidencia flexible (sin depender de
// una cadena exacta) para no fallar por tildes, mayúsculas o pequeñas
// erratas ("pec dec" vs "pec deck", con o sin espacios en las barras, etc.)
function normalizeForMigration(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
function migratedExerciseName(name){
  const n = normalizeForMigration(name);
  if(n.includes("pec dec") || n.includes("pec-deck") || (n.includes("pecdeck"))){
    return "Aperturas de pecho en máquina";
  }
  if(n === normalizeForMigration("Aperturas de pecho")){
    return "Aperturas de pecho en máquina";
  }
  if(n.includes("remo") && n.includes(" t") || n.includes("remo t") || n.includes("remo en barra t")){
    if(name !== "Remo en T") return "Remo en T";
  }
  if(n.includes("bayesian") || n.includes("bayesiano")){
    if(name !== "Curl bayesiano en polea") return "Curl bayesiano en polea";
  }
  // Ejercicios de la rutina por defecto que no coincidían con la biblioteca
  // cerrada (se detectó porque las rutinas de usuarios antiguos los tenían
  // con nombres distintos a los oficiales). Coincidencia flexible para no
  // depender de tildes/mayúsculas exactas.
  if(n.includes("curl") && n.includes("biceps") && n.includes("barra") && n.includes("z")){
    if(name !== "Curl con barra Z") return "Curl con barra Z";
  }
  if(n.includes("triceps") && n.includes("unilateral")){
    if(name !== "Press de tríceps unilateral en polea") return "Press de tríceps unilateral en polea";
  }
  if(n.includes("curl") && n.includes("triceps") && n.includes("barra") && n.includes("v")){
    if(name !== "Extensión de tríceps en polea alta") return "Extensión de tríceps en polea alta";
  }
  if(n.includes("fondos") && n.includes("maquina") && n.includes("libres")){
    if(name !== "Fondos en máquina de tríceps") return "Fondos en máquina de tríceps";
  }
  if(n === normalizeForMigration("Curl predicador")){
    if(name !== "Curl predicador en máquina") return "Curl predicador en máquina";
  }
  if(n.includes("remo") && n.includes("pronado")){
    if(name !== "Jalón con agarre cerrado supino") return "Jalón con agarre cerrado supino";
  }
  // Ejercicios de pierna/abdomen de la rutina por defecto que no coincidían
  // con la biblioteca cerrada (usaban nombres cortos/genéricos en vez del
  // nombre exacto de la biblioteca). Coincidencia EXACTA (no flexible) para
  // no confundir, por ejemplo, "Peso muerto rumano" con la variante ya
  // correcta "Peso muerto rumano con barra", que contiene ese mismo texto.
  if(n === normalizeForMigration("Crunch abdominal")){
    return "Crunch de abdomen en polea";
  }
  if(n === normalizeForMigration("Aductores")){
    return "Aductor externo en máquina";
  }
  if(n === normalizeForMigration("Prensa")){
    return "Prensa de piernas";
  }
  if(n === normalizeForMigration("Femoral sentado")){
    return "Curl femoral sentado";
  }
  if(n === normalizeForMigration("Búlgaras")){
    return "Zancadas búlgaras";
  }
  if(n === normalizeForMigration("Curl de gemelo")){
    return "Extensión de gemelo sentado";
  }
  if(n === normalizeForMigration("Peso muerto rumano")){
    return "Peso muerto rumano con mancuernas";
  }
  if(n === normalizeForMigration("Crunch invertido")){
    return "Dragon flags de abdomen";
  }
  if(n === normalizeForMigration("Rotaciones de oblicuos")){
    return "Rotación de oblicuos en poleas";
  }
  return name;
}
async function migrateExerciseNames(){
  let changed = false;
  const fix = (name) => migratedExerciseName(name);

  (plans || []).forEach(plan => {
    (plan.days || []).forEach(day => {
      (day.exercises || []).forEach(ex => {
        const fixed = fix(ex.name);
        if(fixed !== ex.name){ ex.name = fixed; changed = true; }
      });
    });
  });

  if(state && Array.isArray(state.sessions)){
    state.sessions.forEach(sess => {
      (sess.exercises || []).forEach(ex => {
        const fixed = fix(ex.name);
        if(fixed !== ex.name){ ex.name = fixed; changed = true; }
      });
    });
  }

  if(changed) await syncToServer();
}

// -------------------- HELPERS DE FECHA --------------------
function isoWeekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return date.getUTCFullYear() + "-W" + String(weekNo).padStart(2,"0");
}
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES", { day:"2-digit", month:"short", year:"numeric" });
}

async function onOnboardSubmit(e){
  e.preventDefault();
  const errEl = document.getElementById("onboardError");
  errEl.classList.remove("show");

  const weight = parseFloat(document.getElementById("obWeight").value);
  const height = parseFloat(document.getElementById("obHeight").value);
  const time = document.getElementById("obTime").value;

  if(!weight || weight < 30 || weight > 300){
    errEl.textContent = "Introduce un peso válido (entre 30 y 300 kg).";
    errEl.classList.add("show");
    return;
  }
  if(!height || height < 120 || height > 230){
    errEl.textContent = "Introduce una altura válida (entre 120 y 230 cm).";
    errEl.classList.add("show");
    return;
  }
  if(!time){
    errEl.textContent = "Selecciona cuánto tiempo llevas entrenando.";
    errEl.classList.add("show");
    return;
  }

  const btn = document.getElementById("onboardSubmit");
  btn.disabled = true; btn.textContent = "Guardando…";

  userProfile = { weightKg: weight, heightCm: height, timeTraining: time, weightUpdatedAt: new Date().toISOString(), updatedAt: new Date().toISOString(), weightHistory: [] };
  userProfile.weightHistory.push({ date: userProfile.weightUpdatedAt, weightKg: weight });
  try{
    await apiSaveData();
    renderApp();
  }catch(e){
    userProfile = null;
    errEl.textContent = "No se pudo guardar: " + e.message;
    errEl.classList.add("show");
  } finally {
    btn.disabled = false; btn.textContent = "Guardar y continuar";
  }
}

function authScreenHtml(){
  return `
    <div class="auth-wrap">
      <img class="auth-logo" src="https://adeangomez.github.io/ADEANEASYFIT/assets/icon.png" alt="Adeanfit">
      <h1 class="auth-title display">ADEANFIT</h1>
      <div class="auth-sub">Circuito de entreno personal. El acceso lo gestiona el administrador — si no tienes cuenta, pídesela.</div>
      <div class="auth-card">
        <div class="auth-error" id="authError"></div>
        <form id="authForm">
          <div class="field-group">
            <label>Usuario</label>
            <input type="text" id="authUser" autocomplete="username" autocapitalize="none" placeholder="tu usuario">
          </div>
          <div class="field-group">
            <label>Contraseña</label>
            <input type="password" id="authPass" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary" id="authSubmit">Entrar</button>
        </form>
      </div>
    </div>
  `;
}

function wireAuthEvents(){
  document.getElementById("authForm").addEventListener("submit", onAuthSubmit);
}

function showAuthError(msg){
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.classList.add("show");
}

async function onAuthSubmit(e){
  e.preventDefault();
  if(authBusy) return;
  const errEl = document.getElementById("authError");
  errEl.classList.remove("show");
  const username = document.getElementById("authUser").value.trim();
  const password = document.getElementById("authPass").value;

  if(!username || !password){
    showAuthError("Rellena usuario y contraseña.");
    return;
  }

  authBusy = true;
  const submitBtn = document.getElementById("authSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Un momento…";

  try{
    const res = await apiLogin(username, password);
    authToken = res.token;
    currentUser = res.username || username;
    saveLocalSession(authToken, currentUser);
    await loadUserData();
    renderApp();
    return;
  }catch(e){
    showAuthError(e.message || "No se pudo iniciar sesión.");
  } finally {
    authBusy = false;
    const btn = document.getElementById("authSubmit");
    if(btn){ btn.disabled = false; btn.textContent = "Entrar"; }
  }
}

// Cierra cualquier modal con una animación suave de salida, en vez de desaparecer de golpe
function closeModal(overlay){
  if(!overlay) return;
  overlay.classList.add("closing");
  setTimeout(()=> overlay.remove(), 180);
}

function showAccountModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const locked = !canUpdateWeight();
  let weightLine = "";
  if(userProfile && userProfile.weightKg){
    weightLine = `Peso actual: <b>${userProfile.weightKg} kg</b>`;
    if(userProfile.weightUpdatedAt){
      const daysAgo = Math.floor((Date.now() - new Date(userProfile.weightUpdatedAt).getTime()) / (24*60*60*1000));
      weightLine += ` <span style="color:var(--text-faint);">· actualizado hace ${daysAgo} día${daysAgo===1?'':'s'}</span>`;
    }
  }
  overlay.innerHTML = `
    <div class="modal-sheet">
      ${avatarHtml("avatar-lg")}
      <h3 style="text-align:center;">${currentUser}</h3>
      <div class="modal-sub" style="text-align:center;">Sesión iniciada en este dispositivo</div>
      <div class="avatar-actions">
        <button class="btn-secondary" id="changeAvatarBtn">Cambiar foto de perfil</button>
        ${userProfile && userProfile.avatarBase64 ? `<button class="btn-secondary" id="removeAvatarBtn">Quitar foto</button>` : ``}
      </div>
      <div class="avatar-hint">Usa una foto adecuada — nada explícito ni ilegal. El administrador puede revisarla y quitarla si hace falta.</div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
      ${weightLine ? `<div class="hint" style="text-align:left;margin-top:-8px;margin-bottom:14px;">${weightLine}</div>` : ``}
      <button class="btn-secondary" id="updateWeightBtn" ${locked ? "disabled" : ""}>
        ${locked ? `${ICON_LOCK_INLINE} Podrás actualizar el peso en ${daysUntilWeightUpdate()} día${daysUntilWeightUpdate()===1?'':'s'}` : "Introducir peso en ayunas"}
      </button>
      <button class="btn-secondary" id="changePassBtn">Cambiar contraseña</button>
      <button class="btn-secondary" id="legalBtn">Términos y avisos legales</button>
      <button class="btn-primary" id="logoutBtn" style="background:var(--card-2);color:var(--text);border:1px solid var(--line);margin-top:10px;">Cerrar sesión</button>
      <button class="btn-secondary" id="closeModalBtn">Cancelar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(overlay); });
  document.getElementById("closeModalBtn").addEventListener("click", ()=> closeModal(overlay));
  document.getElementById("legalBtn").addEventListener("click", ()=>{
    closeModal(overlay);
    showLegalModal();
  });
  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    closeModal(overlay);
    await apiLogout();
    clearLocalSession();
    currentUser = null; authToken = null; state = null; plans = []; activePlanId = null; userProfile = null; weightReminderDismissed = false;
    activeTab = "train";
    renderApp();
  });
  document.getElementById("changePassBtn").addEventListener("click", ()=>{
    closeModal(overlay);
    showChangePasswordModal();
  });
  if(!locked){
    document.getElementById("updateWeightBtn").addEventListener("click", ()=>{
      closeModal(overlay);
      showUpdateWeightModal();
    });
  }
  wireAvatarControls(overlay);
}

// -------------------- FOTO DE PERFIL --------------------
const AVATAR_SIZE = 200;           // lado del cuadrado final, en píxeles
const AVATAR_JPEG_QUALITY = 0.78;  // calidad de compresión (0-1)
const AVATAR_MAX_FILE_MB = 8;      // tamaño máximo del archivo original que aceptamos

// Recorta la imagen a un cuadrado centrado y la reduce de tamaño, para no
// guardar fotos enormes (cada guardado manda todo el perfil, así que
// conviene que la foto pese poco). Devuelve una cadena "data:image/jpeg;..."
function resizeImageToSquareDataUrl(file, size, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("No se pudo leer el archivo."));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("El archivo no es una imagen válida."));
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function wireAvatarControls(overlay){
  const changeBtn = document.getElementById("changeAvatarBtn");
  const removeBtn = document.getElementById("removeAvatarBtn");
  const fileInput = document.getElementById("avatarFileInput");
  if(!changeBtn || !fileInput) return;

  changeBtn.addEventListener("click", ()=> fileInput.click());

  fileInput.addEventListener("change", async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
      alert("Selecciona un archivo de imagen (JPG, PNG…).");
      fileInput.value = "";
      return;
    }
    if(file.size > AVATAR_MAX_FILE_MB * 1024 * 1024){
      alert(`La imagen pesa demasiado (máximo ${AVATAR_MAX_FILE_MB}MB). Prueba con otra o haz una captura más pequeña.`);
      fileInput.value = "";
      return;
    }
    changeBtn.disabled = true;
    changeBtn.textContent = "Procesando…";
    try{
      const dataUrl = await resizeImageToSquareDataUrl(file, AVATAR_SIZE, AVATAR_JPEG_QUALITY);
      userProfile.avatarBase64 = dataUrl;
      await apiSaveData();
      closeModal(overlay);
      renderApp();
    }catch(err){
      alert("No se pudo actualizar la foto: " + err.message);
    }finally{
      changeBtn.disabled = false;
      changeBtn.textContent = "Cambiar foto de perfil";
      fileInput.value = "";
    }
  });

  if(removeBtn){
    removeBtn.addEventListener("click", async ()=>{
      removeBtn.disabled = true;
      removeBtn.textContent = "Quitando…";
      try{
        userProfile.avatarBase64 = null;
        await apiSaveData();
        closeModal(overlay);
        renderApp();
      }catch(err){
        alert("No se pudo quitar la foto: " + err.message);
        userProfile.avatarBase64 = userProfile.avatarBase64 || null;
      }finally{
        removeBtn.disabled = false;
        removeBtn.textContent = "Quitar foto";
      }
    });
  }
}

  }

  days.forEach((d,i)=>{

// Permite elegir libremente qué día de la rutina entrenar, en vez de forzar
// siempre el orden estricto (útil si te saltas un día o entrenas fuera de
// orden). Al guardar una sesión se sigue avanzando automáticamente al
// siguiente, pero en cualquier momento puedes tocar otro día del carril.
async function selectTrainDay(index){
  const days = activeDays();
  if(index === state.currentDayIndex || index < 0 || index >= days.length) return;
  if(isSavingSession) return;
  const previous = state.currentDayIndex;
  state.currentDayIndex = index;
  render();
  try{
    await apiSaveData();
  }catch(err){
    state.currentDayIndex = previous;
    alert("No se pudo cambiar de día: " + err.message);
    render();
  }
}

// =======================================================================
// BORRADOR DEL ENTRENAMIENTO EN CURSO (localStorage)
// =======================================================================
// Los kg/reps que vas escribiendo solo existen en los campos del formulario
// hasta que guardas — si el móvil mata la pestaña en segundo plano (algo
// habitual pasados unos minutos sin tocar la pantalla, sobre todo con la
// pantalla bloqueada), se perdían sin remedio. Para evitarlo, cada cambio
// se guarda también aquí, en el propio dispositivo, y se recupera al volver
// —incluso si la app se ha recargado del todo— mientras no haya pasado más
// de una hora.
const TRAIN_DRAFT_MAX_AGE_MS = 60 * 60 * 1000; // 1 hora
function trainDraftKey(){
  return "adeanfit_draft_" + (currentUser || "anon");
}
function saveTrainDraft(day){
  try{
    const inputs = document.querySelectorAll("#sessionForm input");
    const values = {};
    let hasAny = false;
    inputs.forEach(inp=>{
      if(inp.value !== ""){
        values[inp.dataset.ex + "-" + inp.dataset.set + "-" + inp.dataset.type] = inp.value;
        hasAny = true;
      }
    });
    if(!hasAny){
      localStorage.removeItem(trainDraftKey());
      return;
    }
    const draft = {
      planId: activePlanId || null,
      dayIndex: state.currentDayIndex,
      dayName: day.name,
      savedAt: Date.now(),
      values
    };
    localStorage.setItem(trainDraftKey(), JSON.stringify(draft));
  }catch(e){ /* si el navegador bloquea localStorage, simplemente no hay borrador */ }
}
function readTrainDraft(){
  try{
    const raw = localStorage.getItem(trainDraftKey());
    if(!raw) return null;
    const draft = JSON.parse(raw);
    if(!draft || typeof draft !== "object") return null;
    if(Date.now() - draft.savedAt > TRAIN_DRAFT_MAX_AGE_MS){
      localStorage.removeItem(trainDraftKey());
      return null;
    }
    return draft;
  }catch(e){ return null; }
}
function clearTrainDraft(){
  try{ localStorage.removeItem(trainDraftKey()); }catch(e){}
}
function restoreTrainDraft(day){
  const draft = readTrainDraft();
  if(!draft) return;
  // Solo se recupera si coincide con la rutina y el día exactos que se
  // estaban rellenando — si has cambiado de día o de rutina desde entonces,
  // no tiene sentido rellenar campos de otro sitio.
  if(draft.planId !== (activePlanId || null) || draft.dayIndex !== state.currentDayIndex) return;
  let restoredAny = false;
  Object.entries(draft.values).forEach(([key, value])=>{
    const [exIdx, setIdx, type] = key.split("-");
    const input = document.querySelector(`#sessionForm input[data-ex="${exIdx}"][data-set="${setIdx}"][data-type="${type}"]`);
    if(input){ input.value = value; restoredAny = true; }
  });
  if(restoredAny){
    const banner = document.createElement("div");
    banner.className = "hint";
    banner.style.cssText = "text-align:center;margin-bottom:12px;";
    banner.textContent = "Se han recuperado los datos que estabas metiendo sin guardar.";
    const form = document.getElementById("sessionForm");
    if(form) form.insertBefore(banner, form.firstChild);
  }
}
function wireTrainDraftAutosave(day){
  document.querySelectorAll("#sessionForm input").forEach(input=>{
    input.addEventListener("input", ()=> saveTrainDraft(day));
  });
}

function lastTimeFor(exerciseName){
  for(let i = state.sessions.length - 1; i >= 0; i--){
    const s = state.sessions[i];
    const ex = s.exercises.find(e => e.name === exerciseName);
    if(ex){
      let best = 0, bestReps = 0;
      ex.sets.forEach(set => {
        if((set.kg||0) > best){ best = set.kg||0; bestReps = set.reps||0; }
      });
      return { date: s.date, best, bestReps };
    }
  }
  return null;
}

function startSaveCooldownTimer(){
  const btn = document.getElementById("saveSessionBtn");
  if(!btn) return;
  const idleLabel = "Guardar entrenamiento y pasar al siguiente día";
  const timer = setInterval(tick, 250);
  function tick(){
    if(!document.body.contains(btn)){ clearInterval(timer); return; }
    const remaining = Math.max(0, SAVE_COOLDOWN_MS - (Date.now() - lastSaveAt));
    if(remaining <= 0){
      btn.disabled = false;
      btn.textContent = idleLabel;
      clearInterval(timer);
      return;
    }
    btn.disabled = true;
    btn.textContent = `Espera ${Math.ceil(remaining/1000)}s antes de guardar otro día…`;
  }
  tick();
}

// =======================================================================
// TEMPORIZADOR DE DESCANSO
// =======================================================================
let restTimerEndAt = null;
let restTimerTotalMs = null;
let restTimerIntervalId = null;

function renderRestTimerWidget(){
  const el = document.getElementById("restTimerWidget");
  if(!el) return;

  if(restTimerEndAt){
    const remainingMs = Math.max(0, restTimerEndAt - Date.now());
    if(remainingMs <= 0){
      stopRestTimer(true);
      return;
    }
    const totalSec = Math.ceil(remainingMs / 1000);
    const mm = Math.floor(totalSec / 60);
    const ss = totalSec % 60;
    const pct = restTimerTotalMs ? Math.max(0, Math.min(100, 100 - (remainingMs / restTimerTotalMs) * 100)) : 0;
    el.innerHTML = `<div class="rest-timer rest-timer-running">
      <div class="rest-timer-fill" style="width:${pct}%"></div>
      <div class="rest-timer-row">
        <span class="rest-timer-ic">${ICON_TIMER}</span>
        <span class="rest-timer-time">${mm}:${String(ss).padStart(2,"0")}</span>
        <span class="rest-timer-sub">Descansando…</span>
        <button type="button" class="rest-timer-cancel" id="restTimerCancelBtn">Cancelar</button>
      </div>
    </div>`;
    const cancelBtn = document.getElementById("restTimerCancelBtn");
    if(cancelBtn) cancelBtn.addEventListener("click", ()=> stopRestTimer(false));
  } else {
    if(activeTab !== "train"){ el.innerHTML = ""; return; }
    el.innerHTML = `<div class="rest-timer rest-timer-picker">
      <span class="rest-timer-ic" title="Descanso">${ICON_TIMER}</span>
      <div class="rest-timer-options">
        <button type="button" data-sec="60">1:00</button>
        <button type="button" data-sec="90">1:30</button>
        <button type="button" data-sec="120">2:00</button>
        <button type="button" data-sec="150">2:30</button>
        <button type="button" data-sec="180">3:00</button>
      </div>
    </div>`;
    el.querySelectorAll("[data-sec]").forEach(btn=>{
      btn.addEventListener("click", ()=> startRestTimer(Number(btn.dataset.sec)));
    });
  }
}

function startRestTimer(seconds){
  restTimerTotalMs = seconds * 1000;
  restTimerEndAt = Date.now() + restTimerTotalMs;
  if(restTimerIntervalId) clearInterval(restTimerIntervalId);
  restTimerIntervalId = setInterval(renderRestTimerWidget, 250);
  renderRestTimerWidget();
}

function stopRestTimer(finished){
  if(restTimerIntervalId){ clearInterval(restTimerIntervalId); restTimerIntervalId = null; }
  restTimerEndAt = null;
  restTimerTotalMs = null;
  renderRestTimerWidget();
  if(finished){
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    playRestTimerSound();
  }
}

function playRestTimerSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0, 0.18].forEach(delay=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 880;
      const t0 = ctx.currentTime + delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.start(t0); o.stop(t0 + 0.35);
    });
  }catch(e){ /* silencioso si el navegador bloquea audio */ }
}

async function onSaveSession(e){
  e.preventDefault();
  if(isSavingSession) return;
  const days = activeDays();
  const day = days[state.currentDayIndex];
  const plan = activePlan();
  const inputs = document.querySelectorAll("#sessionForm input");
  const data = {};
  inputs.forEach(inp=>{
    const exIdx = inp.dataset.ex, setIdx = inp.dataset.set, type = inp.dataset.type;
    if(!data[exIdx]) data[exIdx] = {};
    if(!data[exIdx][setIdx]) data[exIdx][setIdx] = { kg:0, reps:0 };
    const val = parseFloat(inp.value.replace(",", "."));
    data[exIdx][setIdx][type] = isNaN(val) ? 0 : val;
  });

  const hasAnyData = Object.values(data).some(ex => Object.values(ex).some(s => s.kg > 0 || s.reps > 0));
  if(!hasAnyData){
    if(!confirm("No has introducido ningún peso ni repetición. ¿Guardar igualmente la sesión (en blanco) y avanzar al siguiente día?")) return;
  }

  isSavingSession = true;
  const submitBtn = document.getElementById("saveSessionBtn");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Guardando…"; }

  try{
    const session = {
      id: Date.now(),
      date: new Date().toISOString(),
      dayIndex: state.currentDayIndex,
      dayName: day.name,
      planId: plan ? plan.id : null,
      planName: plan ? plan.name : null,
      exercises: day.exercises.map((ex, exIdx)=>{
        const setsData = data[exIdx] || {};
        const sets = [];
        for(let s=0; s<ex.sets; s++){
          sets.push(setsData[s] || { kg:0, reps:0 });
        }
        return { name: ex.name, sets };
      })
    };

    // Se detectan los récords ANTES de guardar la sesión nueva, comparando
    // contra el historial que había hasta ahora mismo.
    const newRecords = detectSessionRecords(day, data);
    const eligibleForCelebration = hasBeenTrainingLongEnough();

    const newDayIndex = (state.currentDayIndex + 1) % days.length;
    state.sessions.push(session);
    state.currentDayIndex = newDayIndex;
    lastSaveAt = Date.now();
    await syncToServer();
    clearTrainDraft();

    // Comprobación de seguridad: releemos del servidor para confirmar que el
    // avance de día realmente se guardó, en vez de asumirlo a ciegas.
    try{
      const check = await apiGetData();
      if(check && check.state && check.state.currentDayIndex !== newDayIndex){
        console.warn("El día guardado no coincide con lo esperado, reintentando…");
        await syncToServer();
      }
    }catch(e){
      console.error("No se pudo verificar el guardado del día", e);
    }

    render();
    window.scrollTo({top:0, behavior:"smooth"});

    // Solo se celebra si llevas al menos un mes registrando entrenamientos:
    // al principio casi cualquier sesión sería "récord" por falta de
    // historial, y perdería la gracia si saliera constantemente.
    if(newRecords.length > 0 && eligibleForCelebration){
      showRecordCelebration(newRecords);
    }
  } finally {
    isSavingSession = false;
  }
}

// Compara lo recién introducido (aún sin guardar) contra el historial previo
// de cada ejercicio del día, y devuelve los que superan su máximo anterior.
function detectSessionRecords(day, data){
  const records = [];
  day.exercises.forEach((ex, exIdx)=>{
    const setsData = data[exIdx] || {};
    let sessionMax = 0, sessionMaxReps = 0;
    Object.values(setsData).forEach(s=>{
      if((s.kg||0) > sessionMax){ sessionMax = s.kg||0; sessionMaxReps = s.reps||0; }
    });
    if(sessionMax <= 0) return;
    const priorSeries = buildExerciseTimeSeries(ex.name); // usa state.sessions ANTES de añadir la nueva
    if(priorSeries.length === 0) return; // sin historial previo no hay récord que batir todavía
    const prevMax = Math.max(...priorSeries.map(p=>p.maxKg));
    if(sessionMax > prevMax){
      records.push({ name: ex.name, kg: sessionMax, reps: sessionMaxReps, prevKg: prevMax });
    }
  });
  return records;
}

const RECORD_CELEBRATION_MIN_MS = 30 * 24 * 60 * 60 * 1000;
function hasBeenTrainingLongEnough(){
  if(!state.sessions || state.sessions.length === 0) return false;
  let earliest = null;
  state.sessions.forEach(s=>{
    const t = new Date(s.date).getTime();
    if(earliest === null || t < earliest) earliest = t;
  });
  if(earliest === null) return false;
  return (Date.now() - earliest) >= RECORD_CELEBRATION_MIN_MS;
}

function showRecordCelebration(records){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet record-modal">

function exerciseVolume(sets){ return sets.reduce((sum,s)=> sum + (s.kg||0)*(s.reps||0), 0); }
function exerciseMaxWeight(sets){ return sets.reduce((m,s)=> (s.kg||0) > m ? s.kg : m, 0); }

// Serie cronológica completa de peso máximo para un ejercicio, a lo largo de todo el historial
function buildExerciseTimeSeries(exerciseName){
  const points = [];
  state.sessions.forEach(sess=>{
    const ex = sess.exercises.find(e => e.name === exerciseName);
    if(ex){
      const mx = exerciseMaxWeight(ex.sets);
      if(mx > 0) points.push({ date: sess.date, maxKg: mx });
    }
  });
  return points;
}

// Gráfica de línea en SVG, sin librerías externas. values: array de números.
function buildLineChartSvg(values, expected, emptyMessage){
  if(!values || values.length < 2){
    return `<div class="chart-empty">${emptyMessage || "Necesitas al menos 2 sesiones registradas de este ejercicio para ver la gráfica."}</div>`;
  }
  const W = 100, H = 34, padY = 4;
  let max = Math.max(...values);
  let min = Math.min(...values);
  if(expected != null){ max = Math.max(max, expected); min = Math.min(min, expected); }
  const range = (max - min) || 1;
  const stepX = W / (values.length - 1);
  const pts = values.map((v,i) => {
    const x = i * stepX;
    const y = H - padY - ((v - min) / range) * (H - padY * 2);
    return [x, y];
  });
  const pathD = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(2)},${H} L0,${H} Z`;
  const trendUp = values[values.length-1] >= values[0];
  const lineColor = trendUp ? "#34c579" : "#ff5a2e";
  const dotsLast = `<circle cx="${pts[pts.length-1][0].toFixed(2)}" cy="${pts[pts.length-1][1].toFixed(2)}" r="2.2" fill="${lineColor}"/>`;

  let expectedLine = "";
  if(expected != null){
    const ey = H - padY - ((expected - min) / range) * (H - padY * 2);
    expectedLine = `<line x1="0" y1="${ey.toFixed(2)}" x2="${W}" y2="${ey.toFixed(2)}" stroke="#d9a441" stroke-width="1" stroke-dasharray="3,2" vector-effect="non-scaling-stroke"/>`;
  }

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="mini-chart">
      <path d="${areaD}" fill="${lineColor}" opacity="0.12" stroke="none"/>
      ${expectedLine}
      <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      ${dotsLast}
    </svg>`;

  const caption = `
    <div class="chart-caption">
      <span>${min}kg</span>
      <span class="${trendUp?'up':'down'}">${trendUp?'▲':'▼'} ${values[0]}kg → ${values[values.length-1]}kg</span>
      <span>${max}kg</span>
    </div>`;

  let gapHtml = "";
  if(expected != null){
    const current = values[values.length-1];
    const diff = current - expected;
    const pct = (diff/expected)*100;
    const cls = diff >= 0 ? "up" : "down";
    const arrow = diff >= 0 ? "▲" : "▼";
    gapHtml = `<div class="gap-badge ${cls}">${arrow} ${diff>=0?"+":""}${diff.toFixed(1)}kg frente a lo esperado para tu experiencia (${expected}kg) · ${pct>=0?"+":""}${pct.toFixed(0)}%</div>`;
  }

  return svg + caption + gapHtml;
}

function buildExerciseStats(windowType){
  const keyFn = windowType === "week" ? isoWeekKey : monthKey;
  const byExercise = {};
  state.sessions.forEach(sess=>{
    const d = new Date(sess.date);
    const key = keyFn(d);
    sess.exercises.forEach(ex=>{
      if(!byExercise[ex.name]) byExercise[ex.name] = {};
      if(!byExercise[ex.name][key]) byExercise[ex.name][key] = { volume:0, maxKg:0 };
      byExercise[ex.name][key].volume += exerciseVolume(ex.sets);
      const mx = exerciseMaxWeight(ex.sets);
      if(mx > byExercise[ex.name][key].maxKg) byExercise[ex.name][key].maxKg = mx;
    });
  });
  const results = [];
  Object.entries(byExercise).forEach(([name, periods])=>{
    const keys = Object.keys(periods).sort();
    if(keys.length === 0) return;
    const lastKey = keys[keys.length-1];
    const prevKey = keys.length >= 2 ? keys[keys.length-2] : null;
    results.push({ name, lastKey, prevKey, last: periods[lastKey], prev: prevKey ? periods[prevKey] : null });
  });
  results.sort((a,b)=> a.name.localeCompare(b.name));
  return results;
}

function deltaBlock(current, previous){
  if(previous === null || previous === undefined) return `<span class="no-data">Aún no hay periodo anterior para comparar</span>`;
  if(previous === 0) return `<span class="no-data">Sin dato previo comparable</span>`;
  const diff = current - previous;
  const pct = (diff / previous) * 100;
  let cls = "flat", arrow = "→";
  if(pct > 0.5){ cls = "up"; arrow = "▲"; }
  else if(pct < -0.5){ cls = "down"; arrow = "▼"; }
  return `<span class="delta ${cls}">${arrow} ${pct>0?"+":""}${pct.toFixed(1)}%</span>`;
}

function getExerciseDayNames(exerciseName){
  const days = new Set();
  state.sessions.forEach(sess=>{
    if(sess.exercises.some(e => e.name === exerciseName)) days.add(sess.dayName);
  });
  return Array.from(days);
}

function statMatchesQuery(st, q){
  if(!q) return true;
  const nq = normalizeText(q);
  if(normalizeText(st.name).includes(nq)) return true;
  if(getExerciseDayNames(st.name).some(d => normalizeText(d).includes(nq))) return true;
  const libEx = findExerciseByName(st.name);
  if(libEx){
    if(libEx.sub){
      const subSyns = SUB_SYNONYMS[libEx.sub] || [normalizeText(libEx.sub)];
      if(subSyns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s)))) return true;
    }
    const secondaryList = libEx.secondary || [];
    if(secondaryList.some(sec => {
      const subSyns = SUB_SYNONYMS[sec];
      return subSyns ? subSyns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s))) : false;
    })) return true;
    const allMuscles = [libEx.muscle, ...secondaryList];
    if(allMuscles.some(m => {
      const syns = MUSCLE_SYNONYMS[m] || [];
      return syns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s)));
    })) return true;
  }
  return false;
}

  });
  main.innerHTML = html;

const WEIGHT_RANGE_DAYS = { month: 30, quarter: 90, semester: 182, year: 365 };
function sortedWeightHistory(){
  const history = (userProfile && Array.isArray(userProfile.weightHistory)) ? userProfile.weightHistory : [];
  return history
    .filter(e => e && typeof e.weightKg === "number" && e.date)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
}
function filterWeightHistory(history, range){
  if(range === "absolute" || !WEIGHT_RANGE_DAYS[range]) return history;
  const cutoff = Date.now() - WEIGHT_RANGE_DAYS[range] * 24 * 60 * 60 * 1000;
  return history.filter(e => new Date(e.date).getTime() >= cutoff);
}

function renderHistory(){

  let html = `<div class="section-title"><h2>Historial</h2></div>`;

  html += `<div class="hint" style="text-align:left;background:var(--card-2);border-radius:10px;padding:10px 12px;margin-bottom:14px;">Toca una sesión para ver el desglose serie a serie. Al eliminar la sesión más reciente de tu rutina activa, el circuito retrocede un día.</div>`;

      <div class="hist-top" data-toggle="${sess.id}">

      sess.exercises.forEach(ex=>{
        html += `<div class="hist-detail-ex">
          <div class="hist-detail-ex-name">${ex.name}</div>
          <div class="hist-detail-sets">
            ${ex.sets.map((s,i)=>`<span class="hist-set-chip">S${i+1}: ${(s.kg>0||s.reps>0) ? `${s.kg}kg × ${s.reps}` : '—'}</span>`).join("")}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  main.innerHTML = html;

  main.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-del]")) return;
      const id = Number(el.dataset.toggle);
      if(expandedHistoryIds.has(id)) expandedHistoryIds.delete(id);
      else expandedHistoryIds.add(id);
      renderHistory();
    });
  });
  main.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      deleteSession(Number(btn.dataset.del));
    });
  });
  main.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      showEditSessionModal(Number(btn.dataset.edit));
    });
  });
}

function showEditSessionModal(sessionId){
  const sess = state.sessions.find(s => s.id === sessionId);
  if(!sess) return;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  let bodyHtml = `
    <h3>Editar sesión</h3>
    <div class="modal-sub">${sess.dayName}${sess.planName ? ` · ${sess.planName}` : ``} · ${fmtDateFull(sess.date)}</div>
    <form id="editSessionForm">
  `;
  sess.exercises.forEach((ex, exIdx)=>{
    bodyHtml += `<div class="exercise-card" style="margin-top:14px;">
      <div class="exercise-head">
        <div class="exercise-head-top">
          <div class="exercise-head-text"><h3>${ex.name}</h3></div>
        </div>
      </div>
      <div class="col-heads"><span>#</span><span>Kg</span><span>Reps</span></div>
      <div class="sets">`;
    ex.sets.forEach((s, sIdx)=>{
      bodyHtml += `<div class="set-row">
        <div class="lbl">${sIdx+1}</div>
        <div class="field"><input inputmode="decimal" placeholder="0" data-ex="${exIdx}" data-set="${sIdx}" data-type="kg" value="${s.kg ? s.kg : ""}"><span class="unit">KG</span></div>
        <div class="field"><input inputmode="numeric" placeholder="0" data-ex="${exIdx}" data-set="${sIdx}" data-type="reps" value="${s.reps ? s.reps : ""}"><span class="unit">REP</span></div>
      </div>`;
    });
    bodyHtml += `</div></div>`;
  });
  bodyHtml += `
      <button type="submit" class="btn-primary" id="editSessionSaveBtn" style="margin-top:16px;">Guardar cambios</button>
      <button type="button" class="btn-secondary" id="editSessionCancel">Cancelar</button>
    </form>
  `;
  overlay.innerHTML = `<div class="modal-sheet" style="max-height:82vh;overflow-y:auto;">${bodyHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(overlay); });
  document.getElementById("editSessionCancel").addEventListener("click", ()=> closeModal(overlay));
  document.getElementById("editSessionForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const btn = document.getElementById("editSessionSaveBtn");
    if(btn){ btn.disabled = true; btn.textContent = "Guardando…"; }
    overlay.querySelectorAll("input").forEach(inp=>{
      const exIdx = Number(inp.dataset.ex), sIdx = Number(inp.dataset.set), type = inp.dataset.type;
      const val = parseFloat(String(inp.value).replace(",", "."));

    });
    try{
      await syncToServer();
      closeModal(overlay);
      render();
    }catch(err){
      alert("No se pudieron guardar los cambios: " + err.message);
      if(btn){ btn.disabled = false; btn.textContent = "Guardar cambios"; }
    }
  });
}

async function deleteSession(id){
  const idx = state.sessions.findIndex(s => s.id === id);
  if(idx === -1) return;
  const sess = state.sessions[idx];
  const isMostRecent = idx === state.sessions.length - 1;
  const belongsToActivePlan = sess.planId === activePlanId;
  const willRollback = belongsToActivePlan && isMostRecent;

  const msg = willRollback
    ? `¿Eliminar esta sesión (${sess.dayName}, ${fmtDateFull(sess.date)})? Es tu sesión más reciente, así que el circuito retrocederá a este día para que puedas repetirlo.`
    : `¿Eliminar esta sesión (${sess.dayName}, ${fmtDateFull(sess.date)})? No es tu sesión más reciente, así que el día actual del circuito no se verá afectado.`;
  if(!confirm(msg)) return;

  state.sessions.splice(idx, 1);
  expandedHistoryIds.delete(id);

  if(willRollback){
    const days = activeDays();
    if(days.length > 0){
      state.currentDayIndex = ((state.currentDayIndex - 1) % days.length + days.length) % days.length;
    }
  }

  await syncToServer();
  render();
}

const MUSCLE_SYNONYMS = {
  "Pecho": ["pecho", "pectoral", "pectorales", "pecs", "chest"],
  "Espalda": ["espalda", "dorsal", "dorsales", "dorso", "back", "lat", "lats"],
  "Hombro": ["hombro", "hombros", "deltoide", "deltoides", "delt", "delts", "shoulder"],
  "Bíceps": ["biceps", "bíceps", "brazo", "brazos", "curl", "arm", "arms", "bicep"],
  "Tríceps": ["triceps", "tríceps", "tricep"],
  "Abdomen": ["abdomen", "abdominales", "abs", "core", "oblicuos", "oblicuo", "sixpack", "six pack"],
  "Pierna": ["pierna", "piernas", "leg", "legs"],
};
// Sinónimos para los SUBgrupos dentro de "Pierna" (femoral, cuádriceps,
// glúteo, gemelo...). Se buscan aparte de MUSCLE_SYNONYMS para que escribir
// "femoral" encuentre solo ejercicios de femoral, no toda la pierna.
const SUB_SYNONYMS = {
  "Femoral": ["femoral", "femorales", "isquios", "isquiotibiales", "hamstring", "hamstrings"],
  "Cuádriceps": ["cuadriceps", "cuádriceps", "quad", "quads", "quadriceps"],
  "Glúteo": ["gluteo", "glúteo", "gluteos", "glúteos", "gluteus", "glutes", "culo"],
  "Gemelo": ["gemelo", "gemelos", "pantorrilla", "pantorrillas", "calf", "calves"],
};
function normalizeText(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function exerciseMatchesQuery(e, q){
  if(!q) return true;
  const nq = normalizeText(q);
  if(normalizeText(e.name).includes(nq)) return true;
  if(e.sub){
    const subSyns = SUB_SYNONYMS[e.sub] || [normalizeText(e.sub)];
    if(subSyns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s)))) return true;
  }
  const secondaryList = e.secondary || [];
  // Un secundario puede ser un grupo muscular (p.ej. "Hombro") o, dentro de
  // Pierna, un subgrupo (p.ej. "Femoral") — se comprueban los sinónimos de
  // subgrupo primero para que "femoral" encuentre también los ejercicios
  // que lo tienen como secundario, no solo como principal.
  if(secondaryList.some(sec => {
    const subSyns = SUB_SYNONYMS[sec];
    return subSyns ? subSyns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s))) : false;
  })) return true;
  const allMuscles = [e.muscle, ...secondaryList];
  return allMuscles.some(m => {
    const syns = MUSCLE_SYNONYMS[m] || [];
    return syns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s)));
  });
}

function renderExercisePickerGrid(query){
  const grid = document.getElementById("exPickerGrid");
  if(!grid) return;
  const q = query.trim();
  const filtered = EXERCISE_LIBRARY.filter(e => exerciseMatchesQuery(e, q));

  if(filtered.length === 0){
    grid.innerHTML = `<div class="hint" style="padding:16px 0;">Ningún ejercicio coincide con "${escapeAttr(query)}". Prueba a sugerirlo abajo.</div>`;
    return;
  }

  // Se agrupa solo por músculo. El subgrupo (p. ej. "Femoral" dentro de
  // "Pierna") existe en los datos para la búsqueda y para que la IA lo use
  // al generar rutinas, pero no se muestra como categoría aparte aquí.
  const byMuscle = {};
  filtered.forEach(e => { (byMuscle[e.muscle] = byMuscle[e.muscle] || []).push(e); });

  let html = "";
  Object.entries(byMuscle).forEach(([muscle, list])=>{
    html += `<div class="ex-picker-group-label">${muscle}</div><div class="ex-picker-list">`;
    list.forEach(e=>{
      html += `<button type="button" class="ex-picker-row-item" data-name="${escapeAttr(e.name)}">
        <img src="${exerciseImgUrl(e.id)}" alt="" loading="lazy">
        <span class="ex-row-name">${e.name}${e.secondary && e.secondary.length ? ` <span class="ex-row-secondary">· también ${e.secondary.join(", ")}</span>` : ``}</span>
        <span class="ex-row-chevron">${ICON_CHEVRON}</span>
      </button>`;
    });
    html += `</div>`;
  });
  grid.innerHTML = html;

  grid.querySelectorAll(".ex-picker-row-item").forEach(row=>{
    row.addEventListener("click", ()=>{
      if(!pickerTarget) return;
      selectExerciseForSlot(pickerTarget.dayIdx, pickerTarget.exIdx, row.dataset.name);
    });
  });
}

function selectExerciseForSlot(dayIdx, exIdx, exerciseName){
  syncDraftFromDom();
  planDraft.days[dayIdx].exercises[exIdx].name = exerciseName;
  closeExercisePicker();
  renderPlanBuilder();
}

async function onSubmitSuggestion(){
  const nameInput = document.getElementById("suggestNameInput");
  const muscleInput = document.getElementById("suggestMuscleInput");
  const msg = document.getElementById("suggestMsg");
  const name = nameInput.value.trim();
  if(!name){ msg.textContent = "Escribe el nombre del ejercicio."; return; }

  const btn = document.getElementById("submitSuggestBtn");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    await apiFetch("/suggest-exercise", {
      method: "POST",
      body: JSON.stringify({ name, muscle: muscleInput.value.trim() })
    });
    msg.textContent = "¡Gracias! Sugerencia enviada.";
    nameInput.value = ""; muscleInput.value = "";
  }catch(e){
    msg.textContent = "No se pudo enviar: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Enviar sugerencia";
  }
}

async function onSavePlan(){
  syncDraftFromDom();

  const name = planDraft.name.trim();
  if(!name){
    alert("Ponle un nombre a la rutina.");
    return;
  }
  if(planDraft.days.length === 0){
    alert("Añade al menos un día.");
    return;
  }
  for(const day of planDraft.days){
    if(!day.name.trim()){
      alert("Todos los días necesitan un nombre.");
      return;
    }
    if(day.exercises.length === 0){
      alert(`El día "${day.name}" necesita al menos un ejercicio.`);
      return;
    }
    for(const ex of day.exercises){
      if(!ex.name.trim()){
        alert(`Falta el nombre de algún ejercicio en "${day.name}".`);
        return;
      }
      if(!ex.sets || ex.sets < 1){
        alert(`El ejercicio "${ex.name}" necesita al menos 1 serie.`);
        return;
      }
    }
  }

  const newPlan = {
    id: newPlanId(),
    name,
    createdAt: new Date().toISOString(),
    days: planDraft.days.map(d => ({
      name: d.name.trim(),
      sub: "",
      exercises: d.exercises.map(e => ({ name: e.name.trim(), sets: e.sets }))
    }))
  };
  plans.push(newPlan);
  await syncToServer();
  planDraft = null;
  plansView = "list";
  renderPlans();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  renderTrack();
  if(activeTab === "train") renderTrain();
  else if(activeTab === "progress") renderProgress();
  else if(activeTab === "cardio") renderCardio();
  else if(activeTab === "plans") renderPlans();
  else renderHistory();
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === activeTab);
  });
  renderRestTimerWidget();
}

function renderCardio(){
  document.getElementById("main").innerHTML = `<div class="empty">
    <div class="empty-icon">${ICON_CARDIO}</div>
    <div><b>Zona Cardio</b><br>Próximamente podrás registrar aquí tus ejercicios cardiovasculares (running, pádel, bici…) desde una librería cerrada, igual que ya haces con el gimnasio.</div>
  </div>`;
}

// -------------------- RECUPERACIÓN AL VOLVER A LA PESTAÑA --------------------
// En móvil (sobre todo con la app "añadida a inicio" en iOS/Android) es muy
// común que el navegador restaure la pestaña desde el bfcache al volver a
// primer plano SIN recargarla ni pedir nada por red: el JS sigue vivo con el
// día que tenía en memoria desde que se dejó en segundo plano, que puede
// llevar horas o días desfasado. Al detectar una restauración así (o un
// regreso tras estar oculta mucho tiempo) refrescamos los datos reales del
// servidor antes de que el usuario pueda volver a guardar con datos viejos.
let lastHiddenAt = 0;
async function refreshFromServerOnResume(){
  if(!currentUser || !authToken) return;
  if(isSavingSession) return;
  // Si estás en la pestaña Entrenar, es muy probable que tengas kg/reps
  // escritos sin guardar todavía (típico al volver de descansar entre
  // series, cambiar de app un momento o que se apague la pantalla). Antes
  // esto los sobrescribía sin avisar. Ya no hace falta: el guardado en sí
  // (apiSaveData) comprueba la versión del servidor y avisa si hay datos
  // más nuevos, así que aquí basta con NO tocar nada mientras entrenas.
  if(activeTab === "train") return;
  try{
    const fresh = await apiGetData();
    if(fresh){
      plans = Array.isArray(fresh.plans) ? fresh.plans : plans;
      activePlanId = (fresh.activePlanId && plans.some(p=>p.id===fresh.activePlanId)) ? fresh.activePlanId : activePlanId;
      state = (fresh.state && typeof fresh.state === "object") ? fresh.state : state;
      userProfile = fresh.profile || userProfile;
      if(document.getElementById("main")) render();
    }
  }catch(e){
    console.warn("No se pudo refrescar datos al volver a la pestaña", e.message);
  }
}
window.addEventListener("pageshow", (e)=>{ if(e.persisted) refreshFromServerOnResume(); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    if(lastHiddenAt && (Date.now() - lastHiddenAt) > 60000) refreshFromServerOnResume();
  } else {
    lastHiddenAt = Date.now();
  }
});

// -------------------- INIT --------------------
(async function init(){
  const session = loadLocalSession();
  if(session){
    authToken = session.token;
    currentUser = session.username;
    try{
      await loadUserData();
    }catch(e){
      // token caducado o inválido: volver a pedir login
      console.warn("Sesión no válida, pidiendo login de nuevo.", e.message);
      clearLocalSession();
      authToken = null; currentUser = null; state = null; plans = []; activePlanId = null; userProfile = null; weightReminderDismissed = false;
    }
  }
  renderApp();
})();

})();
</script>
