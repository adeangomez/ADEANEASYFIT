<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rutina" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0c0d10" />
<meta name="description" content="ADEANEASYFIT: registra tus entrenamientos, sigue tu rutina y mide tu progreso en el gimnasio." />
<meta name="referrer" content="no-referrer" />
<!-- Política de seguridad: el navegador solo ejecuta el código de app.js y solo
     habla con nuestro servidor. Si cambia la dirección de la app o del servidor,
     hay que actualizar esta línea (y ALLOWED_ORIGINS en worker.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://adeanfit-api.adeangomez873.workers.dev; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" />
<title>ADEANEASYFIT — Tu entrenamiento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #131418;
    --card: #16171c;
    --card-2: #1d1f25;
    --line: #2b2d34;
    --line-soft: #202227;
    --text: #f3f4f6;
    --text-dim: #a4a8b1;
    --text-faint: #676b75;
    --iron: #ff5a2e;
    --iron-hover: #ff6d45;
    --iron-dim: #3d1f14;
    --steel: #8b93a1;
    --up: #34c579;
    --down: #f2504f;
    --flat: #8b93a1;
    --lock: #3a3c43;
    --gold: #d9a441;
    --radius: 14px;
    --radius-lg: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
  }
  body{
    padding-top: var(--safe-top);
    padding-bottom: calc(78px + var(--safe-bottom));
    min-height: 100vh;
  }
  .display{ font-family:'Space Grotesk', sans-serif; letter-spacing: -0.015em; font-weight:700; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* HEADER */
  header.top{
    padding: 20px 20px 16px;
    background: linear-gradient(180deg, var(--bg-elev), var(--bg));
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.45);
  }
  .brand{ display:flex; align-items:center; justify-content:flex-start; gap:0; }
  .brand h1{ font-size: 24px; margin:0; color:var(--text); line-height:1; text-transform:uppercase; }
  .brand h1 span{ color:var(--iron); }
  .tag{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-top:10px; }

  /* DAY TRACK */
  .track{ display:flex; align-items:center; gap:5px; margin-top:18px; }
  .track-node{ flex:1; height:5px; border-radius:3px; background: var(--lock); position:relative; transition: background .25s, transform .1s; cursor:pointer; }
  .track-node:hover{ background: var(--text-faint); }
  .track-node:active{ transform: scaleY(1.6); }
  .track-node.done{ background: var(--steel); }
  .track-node.active{ background: var(--iron); box-shadow: 0 0 8px rgba(255,90,46,0.45); }
  .track-labels{ display:flex; margin-top:8px; }
  .track-labels span{ flex:1; text-align:center; font-size:9px; letter-spacing:0.05em; color:var(--text-faint); text-transform:uppercase; font-weight:600; cursor:pointer; }
  .track-labels span:hover{ color:var(--text-dim); }
  .track-labels span.active{ color:var(--iron); font-weight:700; }

  /* NAV TABS */
  nav.tabs{
    position: fixed; bottom:0; left:0; right:0; display:flex; background: rgba(19,20,24,0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top:1px solid var(--line-soft); padding-bottom: var(--safe-bottom); z-index: 30;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint); padding: 11px 4px 9px;
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:0.03em;
    text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    position:relative; transition: color .18s ease;
  }
  nav.tabs button .ic{ width:21px; height:21px; display:flex; align-items:center; justify-content:center; transition: transform .18s ease; }
  nav.tabs button .ic svg{ width:100%; height:100%; }
  nav.tabs button.active{ color: var(--iron); }
  nav.tabs button.active .ic{ transform: translateY(-1px) scale(1.08); }
  nav.tabs button:active .ic{ transform: scale(0.9); }
  nav.tabs button.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:28px; height:2px; border-radius:0 0 3px 3px; background: var(--iron);
    transition: opacity .18s ease;
  }

  main{ padding: 20px 16px 12px; max-width: 640px; margin: 0 auto; transition: opacity .12s ease; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin: 4px 2px 14px; }
  .section-title h2{ font-family:'Space Grotesk', sans-serif; font-size:21px; margin:0; color:var(--text); font-weight:700; letter-spacing:-0.01em; }
  .pill{ font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding: 5px 10px; border-radius: 100px; background: var(--iron-dim); color: var(--iron-hover); border:1px solid rgba(255,90,46,0.25); }

  .exercise-card{ background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 14px; overflow:hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 16px -10px rgba(0,0,0,0.5); }
  .exercise-head{ padding: 12px 16px 12px; border-bottom: 1px solid var(--line-soft); }
  .exercise-head-top{ display:flex; align-items:center; gap:12px; }
  .exercise-thumb{ width:52px; height:52px; object-fit:contain; background:#fff; border-radius:10px; border:1px solid var(--line-soft); flex-shrink:0; }
  .exercise-head-text{ flex:1; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; min-width:0; }
  .exercise-head h3{ font-size:15.5px; margin:0; font-weight:600; color:var(--text); line-height:1.3; letter-spacing:-0.005em; }
  .exercise-head .setcount{ font-size:10.5px; color:var(--text-faint); font-weight:600; white-space:nowrap; margin-top:2px; letter-spacing:0.02em; }
  .sets{ padding: 6px 12px 12px; }
  .set-row{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; align-items:center; padding: 6px 4px; }
  .set-row .lbl{ font-size:12px; color:var(--text-faint); font-weight:700; text-align:center; }
  .set-row .field{ position:relative; }
  .set-row input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 10px 10px 8px; font-family:'JetBrains Mono'; font-size:15px; font-weight:600; text-align:center; }
  .set-row input:focus{ outline:none; border-color: var(--iron); }
  .set-row input::placeholder{ color: var(--text-faint); font-weight:500; }
  .field .unit{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:9.5px; color:var(--text-faint); pointer-events:none; font-weight:700; }
  .col-heads{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; padding: 2px 4px 4px; margin-top:2px; }
  .col-heads span{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); text-align:center; font-weight:800; }
  .col-heads span:first-child{ visibility:hidden; }
  .set-row.has-fill, .col-heads.has-fill{ grid-template-columns: 28px 1fr 1fr 36px; }
  .fill-btn{ width:36px; height:36px; border-radius:9px; background:var(--card-2); border:1.5px solid var(--iron); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .fill-btn svg{ width:18px; height:18px; }
  .fill-btn:disabled{ opacity:.3; cursor:default; }
  .fill-btn:active:not(:disabled){ background:var(--iron-dim); }

  /* Selector de ejercicios (biblioteca cerrada) */
  .ex-picker-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ex-picker-btn{
    flex:1; display:flex; align-items:center; gap:10px; min-width:0;
    background: var(--card-2); border:1px solid var(--line); border-radius:10px;
    padding:7px 10px 7px 7px; cursor:pointer; text-align:left;
  }
  .ex-thumb{ width:46px; height:46px; border-radius:8px; object-fit:contain; background:#fff; flex-shrink:0; }
  .ex-thumb-empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:16px; border:1px dashed var(--line); background:transparent; }
  .ex-picker-label{ font-size:13.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ex-top-row{ display:flex; align-items:center; gap:8px; margin:-2px 0 12px 4px; font-size:12px; color:var(--text-dim); }
  .ex-top-select{ background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 8px; font-size:12.5px; }
  .set-row .lbl.top{ color: var(--iron); font-weight:800; font-size:14px; }
  .top-tag{ font-size:9px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color: var(--iron); margin-left:8px; }
  .ex-sets-field{ width:76px; flex-shrink:0; }
  .ex-sets-field input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 8px; font-family:'JetBrains Mono'; font-size:14px; font-weight:600; text-align:center; }

  .ex-search-input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:14.5px; margin-bottom:12px; font-family:'Inter'; }
  .ex-search-input:focus{ outline:none; border-color: var(--iron); }
  .ex-picker-grid{ overflow-y:auto; flex:1; margin-bottom:10px; }
  .ex-picker-group-label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); margin:14px 2px 8px; }
  .ex-picker-group-label:first-child{ margin-top:0; }
  .ex-picker-list{ background: var(--card-2); border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  .ex-picker-row-item{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--line-soft);
    padding:10px 12px; cursor:pointer;
  }
  .ex-picker-row-item:last-child{ border-bottom:none; }
  .ex-picker-row-item:active{ background: var(--iron-dim); }
  .ex-picker-row-item img{ width:62px; height:62px; object-fit:contain; background:#fff; border-radius:10px; flex-shrink:0; border:1px solid var(--line-soft); }
  .ex-picker-row-item .ex-row-name{ font-size:13.5px; font-weight:600; color:var(--text); flex:1; line-height:1.3; }
  .ex-row-secondary{ font-size:10.5px; font-weight:600; color:var(--text-faint); }
  .ex-picker-row-item .ex-row-chevron{ color:var(--text-faint); flex-shrink:0; display:flex; }
  .ex-picker-row-item .ex-row-chevron svg{ width:16px; height:16px; }
  .ex-suggest-box{ border-top:1px solid var(--line-soft); padding-top:10px; margin-top:2px; }

  .last-time{ font-size:11px; color:var(--text-faint); text-align:center; margin-top:8px; }
  .last-time b{ color:var(--steel); font-weight:700; }

  .save-bar{ margin-top: 8px; padding: 4px 2px 20px; }

  /* TEMPORIZADOR DE DESCANSO */
  #restTimerWidget{
    position: fixed; left:12px; right:12px; bottom: calc(78px + var(--safe-bottom) + 10px);
    z-index: 25; display:flex; justify-content:center;
  }
  #restTimerWidget:empty{ display:none; }
  .rest-timer{
    width:100%; max-width:460px; background: rgba(24,25,30,0.96); border:1px solid var(--line-soft);
    border-radius: 14px; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow:hidden; position:relative;
  }
  .rest-timer-picker{ display:flex; align-items:center; gap:6px; padding:9px 10px; }
  .rest-timer-ic{ width:16px; height:16px; color:var(--iron); flex-shrink:0; display:flex; }
  .rest-timer-ic svg{ width:100%; height:100%; }
  .rest-timer-sub{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-right:2px; }
  .rest-timer-options{ display:flex; gap:5px; flex:1; }
  .rest-timer-options button{
    flex:1; min-width:0; background:var(--card-2); border:1px solid var(--line); color:var(--text-dim);
    padding:7px 2px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .rest-timer-options button:hover{ background:var(--line-soft); border-color:var(--text-faint); color:var(--text); }
  .rest-timer-options button:active{ transform: scale(0.94); }
  .rest-timer-running .rest-timer-row{ display:flex; align-items:center; gap:8px; padding:10px 14px; position:relative; z-index:1; }
  .rest-timer-fill{ position:absolute; inset:0; background: linear-gradient(90deg, rgba(255,90,46,0.28), rgba(255,90,46,0.12)); transition: width .25s linear; }
  .rest-timer-time{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; color:var(--text); letter-spacing:0.02em; }
  .rest-timer-cancel{
    margin-left:auto; background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:600;
    cursor:pointer; padding:6px 8px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .rest-timer-cancel:hover{ color:var(--down); }
  .btn-primary{ width:100%; background: var(--iron); color:#1a0b06; border:none; padding: 15px; border-radius: 12px; font-size:14.5px; font-weight:700; letter-spacing:0.01em; text-transform:uppercase; cursor:pointer; transition: background .15s; }
  .btn-primary:hover{ background: var(--iron-hover); }
  .btn-primary:active{ transform: scale(0.985); }
  .btn-primary:disabled{ opacity:0.5; }
  .btn-secondary{ width:100%; background:var(--card-2); border:1px solid var(--line); color:var(--text-dim); padding:13px; border-radius:12px; font-size:13px; font-weight:600; margin-top:10px; cursor:pointer; transition: background .15s, border-color .15s, transform .1s; }
  .btn-secondary:hover:not(:disabled){ background: var(--line-soft); border-color: var(--text-faint); color: var(--text); }
  .btn-secondary:active:not(:disabled){ transform: scale(0.985); }
  .btn-secondary:disabled{ opacity:0.55; cursor:default; }

  /* Accesibilidad: foco visible al navegar con teclado, sin afectar al ratón/táctil */
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline: 2px solid var(--iron); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  .btn-text{ background:none; border:none; color: var(--iron); font-weight:600; font-size:13px; cursor:pointer; padding:8px; }
  .btn-ai{
    width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
    background: var(--card-2); border:1px solid rgba(255,90,46,0.38); color: var(--text);
    padding:14px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; transition: border-color .15s, background .15s;
  }
  .btn-ai svg{ width:16px; height:16px; color: var(--iron); flex-shrink:0; }
  .btn-ai:hover{ border-color: rgba(255,90,46,0.65); background: var(--iron-dim); }
  .btn-ai:active{ transform: scale(0.985); }
  .btn-ai:disabled{ opacity:0.6; }
  .hint{ font-size:12px; color:var(--text-faint); text-align:center; margin-top:10px; line-height:1.5; padding: 0 10px; }

  .loading, .empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 80px 20px; color:var(--text-faint); text-align:center; }
  .empty-icon{ width:52px; height:52px; border-radius:50%; background:var(--card-2); border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center; margin-bottom:16px; color:var(--text-faint); }
  .empty-icon svg{ width:24px; height:24px; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color: var(--iron); animation: spin 0.8s linear infinite; margin-bottom:14px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .stat-card{ background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; margin-bottom:12px; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 4px 12px -10px rgba(0,0,0,0.5); }
  .stat-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stat-day-tags{ display:flex; flex-wrap:wrap; gap:5px; margin:-4px 0 10px; }
  .stat-day-tag{ font-size:10px; font-weight:700; color:var(--steel); background:var(--card-2); border:1px solid var(--line-soft); border-radius:100px; padding:3px 9px; }
  .stat-head h3{ font-size:15.5px; margin:0; font-weight:700; }
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .metric{ background: var(--card-2); border-radius:10px; padding:10px 12px; }
  .metric .m-label{ font-size:10px; color:var(--text-faint); text-transform:uppercase; font-weight:800; letter-spacing:0.04em; }
  .metric .m-value{ font-size:19px; font-weight:800; margin-top:3px; font-family:'JetBrains Mono'; }
  .metric .m-sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .delta{ display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:800; margin-top:4px; }
  .delta.up{ color:var(--up); }
  .delta.down{ color:var(--down); }
  .delta.flat{ color:var(--flat); }
  .no-data{ font-size:12px; color:var(--text-faint); font-style:italic; }

  /* Gráficas de evolución */
  .chart-block{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .mini-chart{ width:100%; height:64px; display:block; }
  .chart-caption{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--text-faint); }
  .chart-caption .up{ color:var(--up); font-weight:700; }
  .chart-caption .down{ color:var(--down); font-weight:700; }
  .chart-empty{ font-size:11.5px; color:var(--text-faint); font-style:italic; padding:8px 0; }
  .big-chart{ width:100%; height:200px; display:block; }

  /* Panel de progreso por día (igual esquema que el Panel de clientes del admin) */
  .day-card{ background: var(--card-2); border:1px solid var(--line-soft); border-radius: var(--radius); padding:12px 13px; margin-bottom:10px; }
  .day-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ex-row{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; margin-bottom:6px; }
  .ex-row:hover{ background: rgba(255,255,255,0.03); }
  .exercise-big-card{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .exercise-big-card h3{ margin:0 0 3px; font-size:16px; font-weight:700; }
  .exercise-big-card .muscle-tag{ font-size:10.5px; color:var(--steel); background:var(--card-2); border:1px solid var(--line-soft); border-radius:100px; padding:3px 9px; display:inline-block; }
  .ex-thumb.lg{ width:72px; height:72px; border-radius:12px; }
  .copy-row{ display:flex; gap:8px; align-items:stretch; }
  .copy-row input{ flex:1; min-width:0; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:14.5px; font-family:'Inter'; }
  .copy-row input::placeholder{ color:var(--text-faint); }
  .copy-row input:focus{ outline:none; border-color:var(--iron); }
  .copy-row button{ width:auto; flex-shrink:0; background:var(--iron); color:#1a0b06; border:none; border-radius:10px; padding:0 18px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; transition:background .15s; }
  .copy-row button:hover{ background:var(--iron-hover); }
  .copy-row button:disabled{ opacity:.6; cursor:default; }

  .pp-step{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); margin:16px 2px 8px; }
