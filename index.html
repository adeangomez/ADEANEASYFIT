<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #131418;
    --card: #16171c;
    --card-2: #1d1f25;
    --line: #2b2d34;
    --line-soft: #202227;
    --text: #f3f4f6;
    --text-dim: #a4a8b1;
    --text-faint: #676b75;
    --iron: #ff5a2e;
    --iron-hover: #ff6d45;
    --iron-dim: #3d1f14;
    --steel: #8b93a1;
    --up: #34c579;
    --down: #f2504f;
    --flat: #8b93a1;
    --lock: #3a3c43;
    --gold: #d9a441;
    --radius: 14px;
    --radius-lg: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
  }
  body{
    padding-top: var(--safe-top);
    padding-bottom: calc(78px + var(--safe-bottom));
    min-height: 100vh;
  }
  .display{ font-family:'Space Grotesk', sans-serif; letter-spacing: -0.015em; font-weight:700; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* HEADER */
  header.top{
    padding: 20px 20px 16px;
    background: linear-gradient(180deg, var(--bg-elev), var(--bg));
    border-bottom: 1px solid var(--line-soft);
    position: sticky; top:0; z-index: 20;
  }
  .brand{ display:flex; align-items:center; justify-content:flex-start; gap:0; }
  .brand h1{ font-size: 24px; margin:0; color:var(--text); line-height:1; text-transform:uppercase; }
  .brand h1 span{ color:var(--iron); }
  .tag{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-top:10px; }

  /* DAY TRACK */
  .track{ display:flex; align-items:center; gap:5px; margin-top:18px; }
  .track-node{ flex:1; height:5px; border-radius:3px; background: var(--lock); position:relative; transition: background .25s; }
  .track-node.done{ background: var(--steel); }
  .track-node.active{ background: var(--iron); box-shadow: 0 0 8px rgba(255,90,46,0.45); }
  .track-labels{ display:flex; margin-top:8px; }
  .track-labels span{ flex:1; text-align:center; font-size:9px; letter-spacing:0.05em; color:var(--text-faint); text-transform:uppercase; font-weight:600; }
  .track-labels span.active{ color:var(--iron); font-weight:700; }

  /* NAV TABS */
  nav.tabs{
    position: fixed; bottom:0; left:0; right:0; display:flex; background: rgba(19,20,24,0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top:1px solid var(--line-soft); padding-bottom: var(--safe-bottom); z-index: 30;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint); padding: 11px 4px 9px;
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:0.03em;
    text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    position:relative;
  }
  nav.tabs button .ic{ width:21px; height:21px; display:flex; align-items:center; justify-content:center; }
  nav.tabs button .ic svg{ width:100%; height:100%; }
  nav.tabs button.active{ color: var(--iron); }
  nav.tabs button.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:28px; height:2px; border-radius:0 0 3px 3px; background: var(--iron);
  }

  main{ padding: 20px 16px 12px; max-width: 640px; margin: 0 auto; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin: 4px 2px 14px; }
  .section-title h2{ font-family:'Space Grotesk', sans-serif; font-size:21px; margin:0; color:var(--text); font-weight:700; letter-spacing:-0.01em; }
  .pill{ font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding: 5px 10px; border-radius: 100px; background: var(--iron-dim); color: var(--iron-hover); border:1px solid rgba(255,90,46,0.25); }

  .exercise-card{ background: var(--card); border:1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 14px; overflow:hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 16px -10px rgba(0,0,0,0.5); }
  .exercise-head{ padding: 14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start; border-bottom: 1px solid var(--line-soft); }
  .exercise-head h3{ font-size:15.5px; margin:0; font-weight:600; color:var(--text); line-height:1.3; letter-spacing:-0.005em; }
  .exercise-head .setcount{ font-size:10.5px; color:var(--text-faint); font-weight:600; white-space:nowrap; margin-left:10px; margin-top:2px; letter-spacing:0.02em; }
  .sets{ padding: 6px 12px 12px; }
  .set-row{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; align-items:center; padding: 6px 4px; }
  .set-row .lbl{ font-size:12px; color:var(--text-faint); font-weight:700; text-align:center; }
  .set-row .field{ position:relative; }
  .set-row input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 10px 10px 8px; font-family:'JetBrains Mono'; font-size:15px; font-weight:600; text-align:center; }
  .set-row input:focus{ outline:none; border-color: var(--iron); }
  .set-row input::placeholder{ color: var(--text-faint); font-weight:500; }
  .field .unit{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:9.5px; color:var(--text-faint); pointer-events:none; font-weight:700; }
  .col-heads{ display:grid; grid-template-columns: 28px 1fr 1fr; gap:8px; padding: 2px 4px 4px; margin-top:2px; }
  .col-heads span{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); text-align:center; font-weight:800; }
  .col-heads span:first-child{ visibility:hidden; }

  /* Selector de ejercicios (biblioteca cerrada) */
  .ex-picker-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ex-picker-btn{
    flex:1; display:flex; align-items:center; gap:10px; min-width:0;
    background: var(--card-2); border:1px solid var(--line); border-radius:10px;
    padding:7px 10px 7px 7px; cursor:pointer; text-align:left;
  }
  .ex-thumb{ width:34px; height:34px; border-radius:7px; object-fit:cover; background:#fff; flex-shrink:0; }
  .ex-thumb-empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:16px; border:1px dashed var(--line); background:transparent; }
  .ex-picker-label{ font-size:13.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ex-sets-field{ width:76px; flex-shrink:0; }
  .ex-sets-field input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 8px; font-family:'JetBrains Mono'; font-size:14px; font-weight:600; text-align:center; }

  .ex-search-input{ width:100%; background: var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:14.5px; margin-bottom:12px; font-family:'Inter'; }
  .ex-search-input:focus{ outline:none; border-color: var(--iron); }
  .ex-picker-grid{ overflow-y:auto; flex:1; margin-bottom:10px; }

// -------------------- SESIÓN LOCAL (recordar el token en este dispositivo) --------------------
function loadLocalSession(){
  try{
    const token = localStorage.getItem(AUTH_TOKEN_KEY);
    const username = localStorage.getItem(AUTH_USER_KEY);
    if(token && username) return { token, username };
  }catch(e){}
  return null;
}
function saveLocalSession(token, username){
  try{
    localStorage.setItem(AUTH_TOKEN_KEY, token);
    localStorage.setItem(AUTH_USER_KEY, username);
  }catch(e){}
}
function clearLocalSession(){
  try{
    localStorage.removeItem(AUTH_TOKEN_KEY);
    localStorage.removeItem(AUTH_USER_KEY);
  }catch(e){}
}

// -------------------- LLAMADAS AL SERVIDOR (Cloudflare Worker) --------------------
async function apiFetch(path, options = {}){
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(authToken ? { "Authorization": "Bearer " + authToken } : {}),
      ...(options.headers || {})
    }
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const e = new Error(data.error || ("Error del servidor (" + res.status + ")"));
    e.status = res.status;
    throw e;
  }
  return data;
}

async function apiLogin(username, password){
  return apiFetch("/login", { method: "POST", body: JSON.stringify({ username, password }) });
}
async function apiChangePassword(oldPassword, newPassword){
  return apiFetch("/change-password", { method: "POST", body: JSON.stringify({ oldPassword, newPassword }) });
}
async function apiAnalyzeProgress(){
  return apiFetch("/ai/analyze", { method: "POST" });
}
async function apiGeneratePlan(brief){
  return apiFetch("/ai/generate-plan", { method: "POST", body: JSON.stringify({ brief }) });
}
async function apiLogout(){
  try{ await apiFetch("/logout", { method: "POST" }); }catch(e){}
}
async function apiGetData(){
  return apiFetch("/data", { method: "GET" });
}
async function apiSaveData(){
  return apiFetch("/data", {
    method: "PUT",
    body: JSON.stringify({ plans, activePlanId, state })
  });
}

// Guarda en el servidor; si falla, avisa con el motivo real (no un mensaje generico)
async function syncToServer(){
  try{
    await apiSaveData();
  }catch(e){
    console.error("Error guardando en el servidor", e);
    alert("No se pudo guardar en el servidor: " + e.message);
  }
}

// Carga los datos del usuario ya autenticado; si no tiene nada aún, siembra la rutina clásica
async function loadUserData(){
  const data = await apiGetData();
  if(data && Array.isArray(data.plans) && data.plans.length > 0){
    plans = data.plans;
    activePlanId = data.activePlanId && plans.some(p=>p.id===data.activePlanId) ? data.activePlanId : plans[0].id;
    state = data.state && typeof data.state === "object" ? data.state : { currentDayIndex: 0, sessions: [] };
  } else {
    const seedPlan = {
      id: "default",
      name: "Rutina clásica (5 días)",
      createdAt: new Date().toISOString(),
      days: DEFAULT_DAYS_SEED.map(d => ({ name: d.name, sub: d.sub, exercises: d.exercises.map(e=>({...e})) }))
    };
    plans = [seedPlan];
    activePlanId = seedPlan.id;
    state = { currentDayIndex: 0, sessions: [] };
    await syncToServer();
  }
}

// -------------------- HELPERS DE FECHA --------------------
function isoWeekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return date.getUTCFullYear() + "-W" + String(weekNo).padStart(2,"0");
}
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES", { day:"2-digit", month:"short", year:"numeric" });
}

function authScreenHtml(){
  return `
    <div class="auth-wrap">
      <img class="auth-logo" src="data:image/png;base64,${ICON_B64}" alt="Adeanfit">
      <h1 class="auth-title display">ADEANFIT</h1>
      <div class="auth-sub">Circuito de entreno personal. El acceso lo gestiona el administrador — si no tienes cuenta, pídesela.</div>
      <div class="auth-card">
        <div class="auth-error" id="authError"></div>
        <form id="authForm">
          <div class="field-group">
            <label>Usuario</label>
            <input type="text" id="authUser" autocomplete="username" autocapitalize="none" placeholder="tu usuario">
          </div>
          <div class="field-group">
            <label>Contraseña</label>
            <input type="password" id="authPass" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary" id="authSubmit">Entrar</button>
        </form>
      </div>
    </div>
  `;
}

function wireAuthEvents(){
  document.getElementById("authForm").addEventListener("submit", onAuthSubmit);
}

function showAuthError(msg){
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.classList.add("show");
}

async function onAuthSubmit(e){
  e.preventDefault();
  if(authBusy) return;
  const errEl = document.getElementById("authError");
  errEl.classList.remove("show");
  const username = document.getElementById("authUser").value.trim();
  const password = document.getElementById("authPass").value;

  if(!username || !password){
    showAuthError("Rellena usuario y contraseña.");
    return;
  }

  authBusy = true;
  const submitBtn = document.getElementById("authSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Un momento…";

  try{
    const res = await apiLogin(username, password);
    authToken = res.token;
    currentUser = res.username || username;
    saveLocalSession(authToken, currentUser);
    await loadUserData();
    renderApp();
    return;
  }catch(e){
    showAuthError(e.message || "No se pudo iniciar sesión.");
  } finally {
    authBusy = false;
    const btn = document.getElementById("authSubmit");
    if(btn){ btn.disabled = false; btn.textContent = "Entrar"; }
  }
}

function showAccountModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>${currentUser}</h3>
      <div class="modal-sub">Sesión iniciada en este dispositivo</div>
      <button class="btn-secondary" id="changePassBtn">Cambiar contraseña</button>
      <button class="btn-primary" id="logoutBtn" style="background:var(--card-2);color:var(--text);border:1px solid var(--line);margin-top:10px;">Cerrar sesión</button>
      <button class="btn-secondary" id="closeModalBtn">Cancelar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("closeModalBtn").addEventListener("click", ()=> overlay.remove());
  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    overlay.remove();
    await apiLogout();
    clearLocalSession();
    currentUser = null; authToken = null; state = null; plans = []; activePlanId = null;
    activeTab = "train";
    renderApp();
  });
  document.getElementById("changePassBtn").addEventListener("click", ()=>{
    overlay.remove();
    showChangePasswordModal();
  });
}

function showChangePasswordModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Cambiar contraseña</h3>
      <div class="modal-sub">Introduce tu contraseña actual y la nueva.</div>
      <div class="auth-error" id="pwError"></div>
      <form id="pwForm">
        <div class="field-group">
          <label>Contraseña actual</label>
          <input type="password" id="pwOld" autocomplete="current-password">
        </div>
        <div class="field-group">
          <label>Nueva contraseña</label>
          <input type="password" id="pwNew" autocomplete="new-password">
        </div>
        <div class="field-group">
          <label>Confirmar nueva contraseña</label>
          <input type="password" id="pwNew2" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="pwSubmit">Guardar nueva contraseña</button>
        <button type="button" class="btn-secondary" id="pwCancel">Cancelar</button>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("pwCancel").addEventListener("click", ()=> overlay.remove());
  document.getElementById("pwForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById("pwError");
    errEl.classList.remove("show");
    const oldPassword = document.getElementById("pwOld").value;
    const newPassword = document.getElementById("pwNew").value;
    const newPassword2 = document.getElementById("pwNew2").value;
    if(!oldPassword || !newPassword){
      errEl.textContent = "Rellena todos los campos."; errEl.classList.add("show"); return;
    }
    if(newPassword !== newPassword2){
      errEl.textContent = "Las contraseñas nuevas no coinciden."; errEl.classList.add("show"); return;
    }
    const btn = document.getElementById("pwSubmit");
    btn.disabled = true; btn.textContent = "Guardando…";
    try{
      await apiChangePassword(oldPassword, newPassword);
      overlay.remove();
      alert("Contraseña actualizada correctamente.");
    }catch(err){
      errEl.textContent = err.message || "No se pudo cambiar la contraseña.";
      errEl.classList.add("show");
    } finally {
      btn.disabled = false; btn.textContent = "Guardar nueva contraseña";
    }
  });
}

function renderTrack(){
  const days = activeDays();
  const track = document.getElementById("track");
  const labels = document.getElementById("trackLabels");
  track.innerHTML = ""; labels.innerHTML = "";
  days.forEach((d,i)=>{
    const node = document.createElement("div");
    node.className = "track-node" + (i === state.currentDayIndex ? " active" : (i < state.currentDayIndex ? " done" : ""));
    track.appendChild(node);
    const lab = document.createElement("span");
    lab.textContent = d.name.split(" ")[0] + (d.name.split(" ")[1] ? " "+d.name.split(" ")[1] : "");
    if(i === state.currentDayIndex) lab.className = "active";
    labels.appendChild(lab);
  });
  const plan = activePlan();
  document.getElementById("headerTag").textContent =
    (plan ? plan.name + " · " : "") + "Sesión " + (state.sessions.length + 1) + " · Orden fijo, sin elegir día";
}

function lastTimeFor(exerciseName){
  for(let i = state.sessions.length - 1; i >= 0; i--){
    const s = state.sessions[i];
    const ex = s.exercises.find(e => e.name === exerciseName);
    if(ex){
      const best = ex.sets.reduce((m,s)=> (s.kg||0) > m ? (s.kg||0) : m, 0);
      return { date: s.date, best };
    }
  }
  return null;
}

function startSaveCooldownTimer(){
  const btn = document.getElementById("saveSessionBtn");
  if(!btn) return;
  const idleLabel = "Guardar entrenamiento y pasar al siguiente día";
  const timer = setInterval(tick, 250);
  function tick(){
    if(!document.body.contains(btn)){ clearInterval(timer); return; }
    const remaining = Math.max(0, SAVE_COOLDOWN_MS - (Date.now() - lastSaveAt));
    if(remaining <= 0){
      btn.disabled = false;
      btn.textContent = idleLabel;
      clearInterval(timer);
      return;
    }
    btn.disabled = true;
    btn.textContent = `Espera ${Math.ceil(remaining/1000)}s antes de guardar otro día…`;
  }
  tick();
}

async function onSaveSession(e){
  e.preventDefault();
  if(isSavingSession) return;
  const days = activeDays();
  const day = days[state.currentDayIndex];
  const plan = activePlan();
  const inputs = document.querySelectorAll("#sessionForm input");
  const data = {};
  inputs.forEach(inp=>{
    const exIdx = inp.dataset.ex, setIdx = inp.dataset.set, type = inp.dataset.type;
    if(!data[exIdx]) data[exIdx] = {};
    if(!data[exIdx][setIdx]) data[exIdx][setIdx] = { kg:0, reps:0 };
    const val = parseFloat(inp.value.replace(",", "."));
    data[exIdx][setIdx][type] = isNaN(val) ? 0 : val;
  });

  const hasAnyData = Object.values(data).some(ex => Object.values(ex).some(s => s.kg > 0 || s.reps > 0));
  if(!hasAnyData){
    if(!confirm("No has introducido ningún peso ni repetición. ¿Guardar igualmente la sesión (en blanco) y avanzar al siguiente día?")) return;
  }

  isSavingSession = true;
  const submitBtn = document.getElementById("saveSessionBtn");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Guardando…"; }

  try{
    const session = {
      id: Date.now(),
      date: new Date().toISOString(),
      dayIndex: state.currentDayIndex,
      dayName: day.name,
      planId: plan ? plan.id : null,
      planName: plan ? plan.name : null,
      exercises: day.exercises.map((ex, exIdx)=>{
        const setsData = data[exIdx] || {};
        const sets = [];
        for(let s=0; s<ex.sets; s++){
          sets.push(setsData[s] || { kg:0, reps:0 });
        }
        return { name: ex.name, sets };
      })
    };

    state.sessions.push(session);
    state.currentDayIndex = (state.currentDayIndex + 1) % days.length;
    lastSaveAt = Date.now();
    await syncToServer();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } finally {
    isSavingSession = false;
  }
}

function exerciseVolume(sets){ return sets.reduce((sum,s)=> sum + (s.kg||0)*(s.reps||0), 0); }
function exerciseMaxWeight(sets){ return sets.reduce((m,s)=> (s.kg||0) > m ? s.kg : m, 0); }

// Serie cronológica completa de peso máximo para un ejercicio, a lo largo de todo el historial
function buildExerciseTimeSeries(exerciseName){
  const points = [];
  state.sessions.forEach(sess=>{
    const ex = sess.exercises.find(e => e.name === exerciseName);
    if(ex){
      const mx = exerciseMaxWeight(ex.sets);
      if(mx > 0) points.push({ date: sess.date, maxKg: mx });
    }
  });
  return points;
}

// Gráfica de línea en SVG, sin librerías externas. values: array de números.
function buildLineChartSvg(values){
  if(!values || values.length < 2){
    return `<div class="chart-empty">Necesitas al menos 2 sesiones registradas de este ejercicio para ver la gráfica.</div>`;
  }
  const W = 100, H = 34, padY = 4;
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = (max - min) || 1;
  const stepX = W / (values.length - 1);
  const pts = values.map((v,i) => {
    const x = i * stepX;
    const y = H - padY - ((v - min) / range) * (H - padY * 2);
    return [x, y];
  });
  const pathD = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(2)},${H} L0,${H} Z`;
  const trendUp = values[values.length-1] >= values[0];
  const lineColor = trendUp ? "#34c579" : "#ff5a2e";
  const dotsLast = `<circle cx="${pts[pts.length-1][0].toFixed(2)}" cy="${pts[pts.length-1][1].toFixed(2)}" r="2.2" fill="${lineColor}"/>`;
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="mini-chart">
      <path d="${areaD}" fill="${lineColor}" opacity="0.12" stroke="none"/>
      <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      ${dotsLast}
    </svg>
    <div class="chart-caption">
      <span>${min}kg</span>
      <span class="${trendUp?'up':'down'}">${trendUp?'▲':'▼'} ${values[0]}kg → ${values[values.length-1]}kg</span>
      <span>${max}kg</span>
    </div>`;
}

function buildExerciseStats(windowType){
  const keyFn = windowType === "week" ? isoWeekKey : monthKey;
  const byExercise = {};
  state.sessions.forEach(sess=>{
    const d = new Date(sess.date);
    const key = keyFn(d);
    sess.exercises.forEach(ex=>{
      if(!byExercise[ex.name]) byExercise[ex.name] = {};
      if(!byExercise[ex.name][key]) byExercise[ex.name][key] = { volume:0, maxKg:0 };
      byExercise[ex.name][key].volume += exerciseVolume(ex.sets);
      const mx = exerciseMaxWeight(ex.sets);
      if(mx > byExercise[ex.name][key].maxKg) byExercise[ex.name][key].maxKg = mx;
    });
  });
  const results = [];
  Object.entries(byExercise).forEach(([name, periods])=>{
    const keys = Object.keys(periods).sort();
    if(keys.length === 0) return;
    const lastKey = keys[keys.length-1];
    const prevKey = keys.length >= 2 ? keys[keys.length-2] : null;
    results.push({ name, lastKey, prevKey, last: periods[lastKey], prev: prevKey ? periods[prevKey] : null });
  });
  results.sort((a,b)=> a.name.localeCompare(b.name));
  return results;
}

function deltaBlock(current, previous){
  if(previous === null || previous === undefined) return `<span class="no-data">Aún no hay periodo anterior para comparar</span>`;
  if(previous === 0) return `<span class="no-data">Sin dato previo comparable</span>`;
  const diff = current - previous;
  const pct = (diff / previous) * 100;
  let cls = "flat", arrow = "→";
  if(pct > 0.5){ cls = "up"; arrow = "▲"; }
  else if(pct < -0.5){ cls = "down"; arrow = "▼"; }
  return `<span class="delta ${cls}">${arrow} ${pct>0?"+":""}${pct.toFixed(1)}%</span>`;
}

function getExerciseDayNames(exerciseName){
  const days = new Set();
  state.sessions.forEach(sess=>{
    if(sess.exercises.some(e => e.name === exerciseName)) days.add(sess.dayName);
  });
  return Array.from(days);
}

function statMatchesQuery(st, q){
  if(!q) return true;
  const nq = normalizeText(q);
  if(normalizeText(st.name).includes(nq)) return true;
  return getExerciseDayNames(st.name).some(d => normalizeText(d).includes(nq));
}

  const main = document.getElementById("main");
  let html = `

    main.innerHTML = html;
    wireAiAnalyzeButton();
    wireProgressSearch();

    main.innerHTML = html;
    wireAiAnalyzeButton();
    wireProgressSearch();
    return;
  }
  const periodLabel = progressWindow === "week" ? "semana" : "mes";
  stats.forEach(st=>{
    const series = buildExerciseTimeSeries(st.name).map(p => p.maxKg);
    const dayNames = getExerciseDayNames(st.name);
    html += `<div class="stat-card">

        <div class="metric">

          ${deltaBlock(st.last.volume, st.prev ? st.prev.volume : null)}
        </div>
        <div class="metric">
          <div class="m-label">Peso máx. — última ${periodLabel}</div>
          <div class="m-value">${st.last.maxKg} kg</div>
          ${deltaBlock(st.last.maxKg, st.prev ? st.prev.maxKg : null)}
        </div>
      </div>
      <div class="chart-block">
        <div class="m-label" style="margin-bottom:6px;">Evolución del peso máximo (histórico completo)</div>
        ${buildLineChartSvg(series)}
      </div>
    </div>`;
  });
  main.innerHTML = html;
  wireAiAnalyzeButton();
  wireProgressSearch();
  main.querySelectorAll(".filter-row button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ progressWindow = btn.dataset.w; renderProgress(); });
  });
}

let expandedHistoryIds = new Set();
let lastSaveAt = 0;
let isSavingSession = false;
const SAVE_COOLDOWN_MS = 5000;

function fmtDateFull(iso){
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  return `${dd}-${mm}-${yyyy}`;
}

function renderHistory(){
  const main = document.getElementById("main");
  let html = `<div class="section-title"><h2>Historial</h2></div>`;
  if(state.sessions.length === 0){
    html += `<div class="empty"><div class="empty-icon">${ICON_HISTORY}</div><div>Aquí aparecerán tus sesiones guardadas.</div></div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="hint" style="text-align:left;background:var(--card-2);border-radius:10px;padding:10px 12px;margin-bottom:14px;">Toca una sesión para ver el desglose serie a serie. Al eliminar la sesión más reciente de tu rutina activa, el circuito retrocede un día.</div>`;

  const ordered = [...state.sessions].reverse();
  ordered.forEach(sess=>{
    const isOpen = expandedHistoryIds.has(sess.id);
    html += `<div class="hist-item">
      <div class="hist-top" data-toggle="${sess.id}">
        <div style="flex:1;min-width:0;">
          <div class="hist-date-line">${fmtDateFull(sess.date)}</div>
          <div class="hist-day">${sess.dayName}${sess.planName ? ` <span class="hist-plan">· ${sess.planName}</span>` : ``}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button class="hist-del-btn" data-del="${sess.id}" title="Eliminar sesión">${ICON_TRASH}</button>
          <span class="hist-chevron ${isOpen?'open':''}">${ICON_CHEVRON}</span>
        </div>
      </div>`;
    if(isOpen){
      html += `<div class="hist-detail">`;
      sess.exercises.forEach(ex=>{
        html += `<div class="hist-detail-ex">
          <div class="hist-detail-ex-name">${ex.name}</div>
          <div class="hist-detail-sets">
            ${ex.sets.map((s,i)=>`<span class="hist-set-chip">S${i+1}: ${(s.kg>0||s.reps>0) ? `${s.kg}kg × ${s.reps}` : '—'}</span>`).join("")}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  main.innerHTML = html;

  main.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-del]")) return;
      const id = Number(el.dataset.toggle);
      if(expandedHistoryIds.has(id)) expandedHistoryIds.delete(id);
      else expandedHistoryIds.add(id);
      renderHistory();
    });
  });
  main.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      deleteSession(Number(btn.dataset.del));
    });
  });
}

async function deleteSession(id){
  const idx = state.sessions.findIndex(s => s.id === id);
  if(idx === -1) return;
  const sess = state.sessions[idx];
  const isMostRecent = idx === state.sessions.length - 1;
  const belongsToActivePlan = sess.planId === activePlanId;
  const willRollback = belongsToActivePlan && isMostRecent;

  const msg = willRollback
    ? `¿Eliminar esta sesión (${sess.dayName}, ${fmtDateFull(sess.date)})? Es tu sesión más reciente, así que el circuito retrocederá a este día para que puedas repetirlo.`
    : `¿Eliminar esta sesión (${sess.dayName}, ${fmtDateFull(sess.date)})? No es tu sesión más reciente, así que el día actual del circuito no se verá afectado.`;
  if(!confirm(msg)) return;

  state.sessions.splice(idx, 1);
  expandedHistoryIds.delete(id);

  if(willRollback){
    const days = activeDays();
    if(days.length > 0){
      state.currentDayIndex = ((state.currentDayIndex - 1) % days.length + days.length) % days.length;
    }
  }

  await syncToServer();
  render();
}

    const btn = document.getElementById("aiGenBtn");
    btn.disabled = true; btn.textContent = "Generando…";
    resultEl.innerHTML = `<div class="loading" style="padding:30px 10px;"><div class="spinner"></div><div>Diseñando tu rutina…</div></div>`;
    try{
      const res = await apiGeneratePlan(brief);
      aiGeneratedPlan = res.plan;
      renderAiPlanPreview();
    }catch(e){
      resultEl.innerHTML = `<div class="ai-result ai-error">No se pudo generar la rutina: ${e.message}</div>`;
    } finally {
      btn.disabled = false; btn.innerHTML = `<span class="ic">${ICON_SPARKLE}</span>Generar`;
    }
  });
}

function renderAiPlanPreview(){
  const resultEl = document.getElementById("aiGenResult");
  if(!resultEl || !aiGeneratedPlan) return;
  const p = aiGeneratedPlan;
  let html = `<div style="border-top:1px solid var(--line-soft);padding-top:14px;margin-top:4px;">
    <h3 style="margin:0 0 10px;font-size:16px;">${p.name}</h3>`;
  p.days.forEach(d=>{
    html += `<div style="margin-bottom:10px;">
      <div style="font-weight:700;font-size:13.5px;color:var(--steel);margin-bottom:4px;">${d.name}</div>
      <ul style="margin:0;padding-left:18px;">
        ${d.exercises.map(e=>`<li style="font-size:13px;color:var(--text-dim);">${e.name} — ${e.sets} series</li>`).join("")}
      </ul>
    </div>`;
  });
  html += `
    <button class="btn-primary" id="aiSavePlanBtn" style="margin-top:8px;">Guardar esta rutina</button>
    <button class="btn-secondary" id="aiDiscardBtn">Descartar y volver a escribir</button>
  </div>`;
  resultEl.innerHTML = html;

  document.getElementById("aiSavePlanBtn").addEventListener("click", async ()=>{
    const newPlan = {
      id: newPlanId(),
      name: aiGeneratedPlan.name,
      createdAt: new Date().toISOString(),
      days: aiGeneratedPlan.days
    };
    plans.push(newPlan);
    await syncToServer();
    aiGeneratedPlan = null;
    plansView = "list";
    renderPlans();
    window.scrollTo({top:0, behavior:"smooth"});
  });
  document.getElementById("aiDiscardBtn").addEventListener("click", ()=>{
    aiGeneratedPlan = null;
    resultEl.innerHTML = "";
  });
}

function renderPlanBuilder(){
  const main = document.getElementById("main");
  let html = `
    <div class="section-title">
      <h2>Nueva rutina</h2>
    </div>
    <div class="exercise-card" style="padding:16px;">
      <div class="field-group" style="margin-bottom:16px;">
        <label>Nombre de la rutina</label>
        <input type="text" id="planNameInput" placeholder="p. ej. Fuerza 4 días" value="${escapeAttr(planDraft.name)}">
      </div>
    </div>
  `;

  planDraft.days.forEach((day, dIdx)=>{
    html += `<div class="exercise-card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">
        <div class="field-group" style="margin-bottom:0;flex:1;">
          <label>Día ${dIdx+1} · Nombre</label>
          <input type="text" class="day-name-input" data-day="${dIdx}" placeholder="p. ej. Empuje" value="${escapeAttr(day.name)}">
        </div>
        ${planDraft.days.length > 1 ? `<button type="button" class="btn-text remove-day-btn" data-day="${dIdx}" style="margin-top:18px;">Quitar día</button>` : ``}
      </div>
    `;
    day.exercises.forEach((ex, eIdx)=>{
      const libEx = findExerciseByName(ex.name);
      html += `<div class="ex-picker-row">
        <button type="button" class="ex-picker-btn" data-day="${dIdx}" data-ex="${eIdx}">
          ${libEx ? `<img src="${exerciseImgUrl(libEx.id)}" class="ex-thumb" alt="">` : `<span class="ex-thumb ex-thumb-empty">＋</span>`}
          <span class="ex-picker-label">${ex.name ? escapeAttr(ex.name) : "Elegir ejercicio…"}</span>
        </button>
        <div class="field ex-sets-field"><input inputmode="numeric" class="ex-sets-input" data-day="${dIdx}" data-ex="${eIdx}" placeholder="3" value="${ex.sets}"><span class="unit">SETS</span></div>
        <button type="button" class="btn-text remove-ex-btn" data-day="${dIdx}" data-ex="${eIdx}" style="padding:6px;color:var(--text-faint);">✕</button>
      </div>`;
    });
    html += `<button type="button" class="btn-secondary add-ex-btn" data-day="${dIdx}" style="margin-top:8px;">+ Añadir ejercicio</button>
    </div>`;
  });

  html += `
    <button type="button" class="btn-secondary" id="addDayBtn" style="border-style:dashed;">+ Añadir día</button>
    <div class="save-bar">
      <button type="button" class="btn-primary" id="savePlanBtn">Guardar rutina</button>
      <button type="button" class="btn-secondary" id="cancelPlanBtn">Cancelar</button>
    </div>
  `;

  main.innerHTML = html;
  wirePlanBuilderEvents();
}

function escapeAttr(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function syncDraftFromDom(){
  document.querySelectorAll(".day-name-input").forEach(inp=>{
    planDraft.days[inp.dataset.day].name = inp.value;
  });
  document.querySelectorAll(".ex-sets-input").forEach(inp=>{
    const v = parseInt(inp.value, 10);
    planDraft.days[inp.dataset.day].exercises[inp.dataset.ex].sets = isNaN(v) ? 1 : Math.max(1, Math.min(12, v));
  });
  const nameInput = document.getElementById("planNameInput");
  if(nameInput) planDraft.name = nameInput.value;
}

function wirePlanBuilderEvents(){
  document.getElementById("addDayBtn").addEventListener("click", ()=>{
    syncDraftFromDom();
    planDraft.days.push(emptyDraftDay());
    renderPlanBuilder();
  });
  document.querySelectorAll(".remove-day-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      syncDraftFromDom();
      planDraft.days.splice(parseInt(btn.dataset.day,10), 1);
      renderPlanBuilder();
    });
  });
  document.querySelectorAll(".add-ex-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      syncDraftFromDom();
      planDraft.days[btn.dataset.day].exercises.push({ name:"", sets:3 });
      renderPlanBuilder();
    });
  });
  document.querySelectorAll(".remove-ex-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      syncDraftFromDom();
      const dIdx = btn.dataset.day, eIdx = btn.dataset.ex;
      if(planDraft.days[dIdx].exercises.length <= 1) return; // al menos 1 ejercicio por día
      planDraft.days[dIdx].exercises.splice(eIdx, 1);
      renderPlanBuilder();
    });
  });
  document.querySelectorAll(".ex-picker-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      syncDraftFromDom();
      openExercisePicker(parseInt(btn.dataset.day,10), parseInt(btn.dataset.ex,10));
    });
  });
  document.getElementById("cancelPlanBtn").addEventListener("click", ()=>{
    planDraft = null;
    plansView = "list";
    renderPlans();
  });
  document.getElementById("savePlanBtn").addEventListener("click", onSavePlan);
}

// =======================================================================
// SELECTOR DE EJERCICIOS (lista cerrada, con búsqueda y sugerencias)
// =======================================================================
let pickerTarget = null; // { dayIdx, exIdx }

function openExercisePicker(dayIdx, exIdx){
  pickerTarget = { dayIdx, exIdx };
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "exercisePickerOverlay";
  overlay.innerHTML = `
    <div class="modal-sheet" style="max-height:82vh; display:flex; flex-direction:column;">
      <h3>Elegir ejercicio</h3>
      <input type="text" id="exSearchInput" placeholder="Buscar por nombre…" class="ex-search-input">
      <div id="exPickerGrid" class="ex-picker-grid"></div>
      <div class="ex-suggest-box">
        <button type="button" class="btn-text" id="toggleSuggestBtn">¿No está el que buscas? Sugerir ejercicio nuevo</button>
        <div id="suggestForm" style="display:none;">
          <div class="field-group" style="margin-top:10px;">
            <label>Nombre del ejercicio</label>
            <input type="text" id="suggestNameInput" placeholder="p. ej. Press Arnold">
          </div>
          <div class="field-group">
            <label>Grupo muscular (opcional)</label>
            <input type="text" id="suggestMuscleInput" placeholder="p. ej. Hombro">
          </div>
          <button type="button" class="btn-primary" id="submitSuggestBtn" style="margin-top:4px;">Enviar sugerencia</button>
          <div id="suggestMsg" class="hint" style="margin-top:8px;"></div>
        </div>
      </div>
      <button type="button" class="btn-secondary" id="closePickerBtn">Cerrar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeExercisePicker(); });
  document.getElementById("closePickerBtn").addEventListener("click", closeExercisePicker);
  document.getElementById("exSearchInput").addEventListener("input", (e)=>{
    renderExercisePickerGrid(e.target.value);
  });
  document.getElementById("toggleSuggestBtn").addEventListener("click", ()=>{
    const form = document.getElementById("suggestForm");
    form.style.display = form.style.display === "none" ? "block" : "none";
  });
  document.getElementById("submitSuggestBtn").addEventListener("click", onSubmitSuggestion);
  renderExercisePickerGrid("");
}

function closeExercisePicker(){
  const overlay = document.getElementById("exercisePickerOverlay");
  if(overlay) overlay.remove();
  pickerTarget = null;
}

const MUSCLE_SYNONYMS = {
  "Pecho": ["pecho", "pectoral", "pectorales", "pecs", "chest"],
  "Espalda": ["espalda", "dorsal", "dorsales", "dorso", "back", "lat", "lats"],
  "Hombro": ["hombro", "hombros", "deltoide", "deltoides", "shoulder"],
};
function normalizeText(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function exerciseMatchesQuery(e, q){
  if(!q) return true;
  const nq = normalizeText(q);
  if(normalizeText(e.name).includes(nq)) return true;
  const allMuscles = [e.muscle, ...(e.secondary||[])];
  return allMuscles.some(m => {
    const syns = MUSCLE_SYNONYMS[m] || [];
    return syns.some(s => normalizeText(s).includes(nq) || nq.includes(normalizeText(s)));
  });
}

function renderExercisePickerGrid(query){
  const grid = document.getElementById("exPickerGrid");
  if(!grid) return;
  const q = query.trim();
  const filtered = EXERCISE_LIBRARY.filter(e => exerciseMatchesQuery(e, q));

  if(filtered.length === 0){
    grid.innerHTML = `<div class="hint" style="padding:16px 0;">Ningún ejercicio coincide con "${escapeAttr(query)}". Prueba a sugerirlo abajo.</div>`;
    return;
  }

  // agrupar por musculo
  const byMuscle = {};
  filtered.forEach(e => { (byMuscle[e.muscle] = byMuscle[e.muscle] || []).push(e); });

  let html = "";
  Object.entries(byMuscle).forEach(([muscle, list])=>{
    html += `<div class="ex-picker-group-label">${muscle}</div><div class="ex-picker-list">`;
    list.forEach(e=>{
      html += `<button type="button" class="ex-picker-row-item" data-name="${escapeAttr(e.name)}">
        <img src="${exerciseImgUrl(e.id)}" alt="" loading="lazy">
        <span class="ex-row-name">${e.name}${e.secondary && e.secondary.length ? ` <span class="ex-row-secondary">· también ${e.secondary.join(", ")}</span>` : ``}</span>
        <span class="ex-row-chevron">${ICON_CHEVRON}</span>
      </button>`;
    });
    html += `</div>`;
  });
  grid.innerHTML = html;

  grid.querySelectorAll(".ex-picker-row-item").forEach(row=>{
    row.addEventListener("click", ()=>{
      if(!pickerTarget) return;
      selectExerciseForSlot(pickerTarget.dayIdx, pickerTarget.exIdx, row.dataset.name);
    });
  });
}

function selectExerciseForSlot(dayIdx, exIdx, exerciseName){
  syncDraftFromDom();
  planDraft.days[dayIdx].exercises[exIdx].name = exerciseName;
  closeExercisePicker();
  renderPlanBuilder();
}

async function onSubmitSuggestion(){
  const nameInput = document.getElementById("suggestNameInput");
  const muscleInput = document.getElementById("suggestMuscleInput");
  const msg = document.getElementById("suggestMsg");
  const name = nameInput.value.trim();
  if(!name){ msg.textContent = "Escribe el nombre del ejercicio."; return; }

  const btn = document.getElementById("submitSuggestBtn");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    await apiFetch("/suggest-exercise", {
      method: "POST",
      body: JSON.stringify({ name, muscle: muscleInput.value.trim() })
    });
    msg.textContent = "¡Gracias! Sugerencia enviada.";
    nameInput.value = ""; muscleInput.value = "";
  }catch(e){
    msg.textContent = "No se pudo enviar: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Enviar sugerencia";
  }
}

async function onSavePlan(){
  syncDraftFromDom();

  const name = planDraft.name.trim();
  if(!name){
    alert("Ponle un nombre a la rutina.");
    return;
  }
  if(planDraft.days.length === 0){
    alert("Añade al menos un día.");
    return;
  }
  for(const day of planDraft.days){
    if(!day.name.trim()){
      alert("Todos los días necesitan un nombre.");
      return;
    }
    if(day.exercises.length === 0){
      alert(`El día "${day.name}" necesita al menos un ejercicio.`);
      return;
    }
    for(const ex of day.exercises){
      if(!ex.name.trim()){
        alert(`Falta el nombre de algún ejercicio en "${day.name}".`);
        return;
      }
      if(!ex.sets || ex.sets < 1){
        alert(`El ejercicio "${ex.name}" necesita al menos 1 serie.`);
        return;
      }
    }
  }

  const newPlan = {
    id: newPlanId(),
    name,
    createdAt: new Date().toISOString(),
    days: planDraft.days.map(d => ({
      name: d.name.trim(),
      sub: "",
      exercises: d.exercises.map(e => ({ name: e.name.trim(), sets: e.sets }))
    }))
  };
  plans.push(newPlan);
  await syncToServer();
  planDraft = null;
  plansView = "list";
  renderPlans();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  renderTrack();
  if(activeTab === "train") renderTrain();
  else if(activeTab === "progress") renderProgress();
  else if(activeTab === "plans") renderPlans();
  else renderHistory();
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === activeTab);
  });
}

// -------------------- INIT --------------------
(async function init(){
  const session = loadLocalSession();
  if(session){
    authToken = session.token;
    currentUser = session.username;
    try{
      await loadUserData();
    }catch(e){
      // token caducado o inválido: volver a pedir login
      console.warn("Sesión no válida, pidiendo login de nuevo.", e.message);
      clearLocalSession();
      authToken = null; currentUser = null; state = null; plans = []; activePlanId = null;
    }
  }
  renderApp();
})();

})();
